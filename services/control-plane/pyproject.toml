[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane"
version = "0.1.0"
description = "Read-only FastAPI control plane for the Autonomous Production Reliability Platform (Phase 3B). Serves reliability.incidents from the existing PostgreSQL database (schema owned exclusively by Flyway migrations); does not ingest alerts (Phase 3C) or modify incident lifecycle state (Phase 3D)."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    # Phase 14: verifies the signed service assertion web-console's BFF
    # mints (core/authz.py) -- a mature, widely-used JWT library, never
    # homegrown signature verification.
    "pyjwt==2.10.1",
    # Phase 16 correction round (item 3): independent verification found
    # the official OpenTelemetry Python HTTP metrics exporter
    # (opentelemetry-exporter-otlp-proto-http) hardcodes
    # `Content-Type: application/x-protobuf` and has NO JSON code path
    # at all -- a JSON-only ingestion endpoint is therefore incompatible
    # with every official OTel SDK's default HTTP metrics exporter.
    # This is the official project's own generated protobuf message
    # definitions (pure Python + protobuf, no C toolchain needed) --
    # used only to decode a real OTLP/HTTP protobuf body into the exact
    # same validated shape the existing JSON path already produces (see
    # ingestion/otlp_protobuf.py); it does not change this service's own
    # OTLP/HTTP JSON support, which remains for samples/otel-sample-app/
    # and any other hand-built JSON client.
    "opentelemetry-proto==1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane"
version = "0.1.0"
description = "Read-only FastAPI control plane for the Autonomous Production Reliability Platform (Phase 3B). Serves reliability.incidents from the existing PostgreSQL database (schema owned exclusively by Flyway migrations); does not ingest alerts (Phase 3C) or modify incident lifecycle state (Phase 3D)."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

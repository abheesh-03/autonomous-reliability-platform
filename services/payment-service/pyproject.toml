[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-service"
version = "0.1.0"
description = "Payment service for the Autonomous Production Reliability Platform demo application. Provides a simulated payment authorization endpoint; no real payment provider, checkout integration, or database persistence."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]
# OpenTelemetry zero-code auto-instrumentation (Phase 2A.3), kept
# separate from core runtime dependencies. Only installed/activated in
# the Docker Compose environment via `opentelemetry-instrument`; the
# service's own source is unmodified and does not import these.
observability = [
    "opentelemetry-distro==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]

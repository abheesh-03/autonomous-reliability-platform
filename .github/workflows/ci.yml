name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    # Raised from 20: Phase 4's real acceptance step (CheckoutServerErrors'
    # real 5-minute rate() decay on recovery) alone measured ~8-9 minutes
    # locally, on top of the pre-existing Collector-outage gate and every
    # build/test step.
    # Raised from 35: Phase 5's own step adds a few more minutes on
    # top of Phase 4's real multi-minute CheckoutServerErrors
    # firing/recovery wait.
    # Raised from 40: Phase 6's own step (indexing + search + one more
    # RAG-integrated investigation) measured well under a minute
    # locally, but a generous margin is kept for CI runner variance.
    # Raised from 45: Phase 7 adds a real PostgreSQL checkpoint-
    # durability/privilege-boundary test step plus its own real
    # acceptance gate (agent run creation, restart, resume) -- measured
    # well under two minutes combined locally, generous margin kept.
    # Raised from 50: Phase 8 adds tool-gateway's own Go
    # gofmt/vet/test/build, a real PostgreSQL remediation-transaction
    # test step, and its own real acceptance gate (sustained real 5xx
    # traffic until CheckoutServerErrors fires, then its own real
    # ~5-minute rate() decay back to inactive -- the same documented
    # multi-minute wait scripts/simulate-failure.sh's own
    # payment-outage --full-acceptance already budgets for this exact
    # alert) -- measured several minutes locally, generous margin kept
    # for CI runner variance.
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check shell script syntax
        run: bash -n scripts/check-env.sh && bash -n scripts/verify-persistence.sh && bash -n scripts/verify-control-plane.sh && bash -n scripts/init-webhook-secret.sh && bash -n scripts/verify-webhook-ingestion.sh && bash -n scripts/verify-alert-lifecycle.sh && bash -n scripts/verify-incident-lifecycle.sh && bash -n scripts/verify-incident-audit.sh && bash -n scripts/simulate-failure.sh && bash -n scripts/test-simulate-failure.sh && bash -n scripts/verify-failure-simulation.sh && bash -n scripts/verify-investigator.sh && bash -n scripts/test-verify-investigator-restore.sh && bash -n scripts/verify-rag.sh && bash -n scripts/init-agent-runtime-db.sh && bash -n scripts/verify-agent-runtime.sh && bash -n scripts/test-db-up-order.sh && bash -n scripts/test-init-agent-runtime-db-fresh.sh && bash -n scripts/init-remediation-secrets.sh && bash -n scripts/verify-remediation.sh && bash -n scripts/test-remediation-cleanup-resilience.sh

      - name: Verify Makefile is usable
        run: make help

      # Phase 4: scenario-selection/safety-check/restoration-behavior
      # tests for scripts/simulate-failure.sh. No Docker/Compose stack
      # needed — every case here either exits during argument parsing
      # (before any Docker call) or exercises restore_target() with
      # docker stubbed. See scripts/test-simulate-failure.sh.
      - name: Run failure-simulation focused tests (Phase 4)
        run: make test-failure-simulation

      # Phase 7 correction round (finding #1): a static, no-Docker
      # regression test proving db-up's recipe provisions
      # agent-runtime-service's real checkpoint-database credential
      # BEFORE the full `docker compose up -d` that actually CREATES
      # that container -- see scripts/test-db-up-order.sh and the
      # Makefile's own db-up ordering comment.
      - name: Run db-up ordering focused test (Phase 7)
        run: make test-db-up-order

      # Phase 8 correction round (finding #8): a static, no-Docker
      # regression proving verify-remediation.sh's own EXIT cleanup
      # trap tolerates a simulated payment_fault_get failure (e.g. a
      # genuinely unreachable payment-service) without aborting early
      # under `set -euo pipefail` -- every remaining restoration step
      # still runs, and cleanup still forces a nonzero exit status. See
      # scripts/test-remediation-cleanup-resilience.sh.
      - name: Run remediation cleanup resilience focused test (Phase 8)
        run: ./scripts/test-remediation-cleanup-resilience.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build checkout-service
        working-directory: services/checkout-service
        run: ./mvnw -B -DskipTests package

      - name: Run checkout-service tests
        working-directory: services/checkout-service
        run: ./mvnw -B test

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install payment-service dependencies
        working-directory: services/payment-service
        run: pip install -e ".[dev]"

      - name: Run payment-service tests
        working-directory: services/payment-service
        run: pytest -v

      # Phase 3B: unit tests only (fake repository, no real database —
      # see services/control-plane/tests/conftest.py). Reuses the same
      # Python 3.13 setup as payment-service above, no second
      # setup-python step needed.
      - name: Install control-plane dependencies
        working-directory: services/control-plane
        run: pip install -e ".[dev]"

      - name: Run control-plane tests
        working-directory: services/control-plane
        run: pytest -v

      # Phase 5: unit tests only -- httpx.MockTransport/fake client
      # doubles and the deterministic StubProvider (see
      # services/investigator-service/tests/), never a real network
      # call and never a real, paid LLM API call. Reuses the same
      # Python 3.13 setup above.
      - name: Install investigator-service dependencies
        working-directory: services/investigator-service
        run: pip install -e ".[dev]"

      - name: Run investigator-service tests
        working-directory: services/investigator-service
        run: pytest -v

      # Phase 5 correction round (issue 4): scripts/verify-investigator.sh's
      # on_exit provider-restoration logic, unit-tested in isolation
      # with docker/wait_healthy/investigator_provider_mode stubbed.
      # No Docker, Compose, or running stack needed -- see
      # scripts/test-verify-investigator-restore.sh.
      - name: Run investigator provider-restoration focused tests (Phase 5)
        run: make test-verify-investigator-restore

      # Phase 6: unit tests only -- httpx.MockTransport, monkeypatched
      # db.py functions, and the deterministic LocalLexicalEmbeddingProvider
      # (see services/retrieval-service/tests/), never a real database
      # connection and never a real, paid embedding API call. Reuses
      # the same Python 3.13 setup above. The deterministic retrieval-
      # quality smoke test resolves the real knowledge/runbooks/
      # corpus via a relative path from this checked-out repo (no
      # Docker mount needed here, unlike the local `make
      # retrieval-test` target, since this step already runs directly
      # against the full checkout).
      - name: Install retrieval-service dependencies
        working-directory: services/retrieval-service
        run: pip install -e ".[dev]"

      - name: Run retrieval-service tests
        working-directory: services/retrieval-service
        run: pytest -v

      # Phase 7: unit tests only -- fake control-plane/investigator
      # client doubles and InMemorySaver (Phase 7 §LANGGRAPH: allowed
      # for focused unit tests where persistence is not under test;
      # see services/agent-runtime-service/tests/), never a real
      # database connection. Reuses the same Python 3.13 setup above.
      # AGENT_RUNTIME_REQUIRE_REAL_DB is intentionally NOT set here, so
      # the real-database tests (test_db_privilege_boundary.py,
      # test_checkpoint_durability.py, test_checkpoint_pool_recovery.py)
      # skip cleanly -- PostgreSQL doesn't exist yet at this point in
      # the job. See the dedicated
      # real-database step further below, after Phase 3A migrations are
      # applied and the agent_runtime role/schema are provisioned.
      - name: Install agent-runtime-service dependencies
        working-directory: services/agent-runtime-service
        run: pip install -e ".[dev]"

      - name: Run agent-runtime-service tests
        working-directory: services/agent-runtime-service
        run: pytest -v

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: services/inventory-service/go.mod

      - name: Check inventory-service formatting
        working-directory: services/inventory-service
        run: test -z "$(gofmt -l .)"

      - name: Run inventory-service go vet
        working-directory: services/inventory-service
        run: go vet ./...

      - name: Run inventory-service tests
        working-directory: services/inventory-service
        run: go test ./...

      - name: Build inventory-service binary
        working-directory: services/inventory-service
        run: CGO_ENABLED=0 GOOS=linux go build -o /tmp/inventory-service ./cmd/inventory-service

      # Phase 8: tool-gateway, the ninth backend service -- reuses the
      # SAME Go 1.27 toolchain just set up above (no second
      # actions/setup-go step needed; this module has no external
      # dependencies at all, so there is nothing for a separate
      # cache-dependency-path to cache either). gofmt/vet/test/build,
      # same discipline as inventory-service above.
      - name: Check tool-gateway formatting
        working-directory: services/tool-gateway
        run: test -z "$(gofmt -l .)"

      - name: Run tool-gateway go vet
        working-directory: services/tool-gateway
        run: go vet ./...

      - name: Run tool-gateway tests
        working-directory: services/tool-gateway
        run: go test ./...

      - name: Build tool-gateway binary
        working-directory: services/tool-gateway
        run: CGO_ENABLED=0 GOOS=linux go build -o /tmp/tool-gateway ./cmd/tool-gateway

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install notification-service dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Run notification-service typecheck
        working-directory: services/notification-service
        run: npm run typecheck

      - name: Run notification-service tests
        working-directory: services/notification-service
        run: npm test

      - name: Build notification-service
        working-directory: services/notification-service
        run: npm run build

      - name: Create runtime .env from .env.example
        run: cp .env.example .env

      # Phase 3C/3D: generates the local Bearer tokens control-plane's
      # two trusted write endpoints require — CONTROL_PLANE_WEBHOOK_TOKEN
      # (Alertmanager's webhook, also mirrored into
      # observability/alertmanager/secrets/webhook-token) and
      # CONTROL_PLANE_LIFECYCLE_TOKEN (the separate human/operator
      # PATCH /api/v1/incidents/{id}/status credential, .env only — see
      # scripts/init-webhook-secret.sh). Must run before Compose config
      # validation/startup below, since docker-compose.yml reads both
      # (each with an empty-string default, so this step isn't strictly
      # required for `docker compose config` to succeed, but IS
      # required for either endpoint to actually work once control-plane
      # starts). This step is also the webhook token's permission
      # PREFLIGHT: the script's final action runs the real, pinned
      # prom/alertmanager:v0.34.1 image, as its real non-root user
      # ("nobody", uid/gid 65534), against the freshly-written token
      # file and confirms it is actually readable — failing this step
      # closed, before any container starts, rather than only
      # discovering a host-permission mismatch once Alertmanager tries
      # and fails to deliver a real webhook later in this job. Never
      # prints either token's contents, on a fresh runner (no prior
      # .env or secrets/ directory) or an existing one alike.
      - name: Initialize webhook + lifecycle secrets (Phase 3C/3D)
        run: ./scripts/init-webhook-secret.sh

      # Phase 8: generates the six remediation Bearer tokens (see
      # scripts/init-remediation-secrets.sh). Same reasoning as the
      # webhook/lifecycle step above -- must exist before any container
      # that reads one of them is ever created. `make db-up` below
      # calls this same idempotent script again as part of its own
      # recipe; running it explicitly here first is the same
      # established double-call pattern the webhook/lifecycle step
      # above already uses.
      - name: Initialize remediation secrets (Phase 8)
        run: ./scripts/init-remediation-secrets.sh

      - name: Validate Docker Compose configuration
        run: docker compose config

      # Post-commit fix (GitHub Actions run #32): this is the exact
      # regression that run failed on -- a genuinely fresh runner's
      # PostgreSQL volume has no Flyway-owned `reliability` schema yet,
      # and scripts/init-agent-runtime-db.sh's own defense-in-depth
      # REVOKEs used to reference it unconditionally, failing outright
      # ("ERROR: schema "reliability" does not exist"). This was hidden
      # locally by a developer's preserved volume that already has
      # `reliability` from earlier phases. Runs the REAL, unmodified
      # init script against a real, but completely isolated and
      # temporary PostgreSQL instance (its own COMPOSE_PROJECT_NAME/
      # POSTGRES_PORT, cleaned up via its own EXIT trap) -- never this
      # job's own `postgres` service, which `make db-up` has not even
      # started yet at this point in the job. Placed here, BEFORE
      # `make db-up` below, specifically to catch this exact failure
      # mode before it can reproduce in that step again.
      - name: Verify init-agent-runtime-db.sh on a genuinely fresh database (Phase 7)
        run: make test-init-agent-runtime-db-fresh

      # Captured before anything starts, so it pre-dates every
      # container's own first log line. Passed to the Loki log-evidence
      # step below (--after-ns) so that check requires genuinely fresh
      # ingestion during this run, not just any entry in a lookback
      # window (matching the same pattern used in
      # scripts/verify-observability.sh). Portable across macOS/Linux
      # runners: unlike `date +%s%N` (whose `%N` is GNU-only and
      # silently broken on macOS/BSD date), Python's time.time_ns()
      # behaves identically everywhere.
      - name: Capture run-start timestamp
        id: run-start
        run: echo "ns=$(python3 -c 'import time; print(time.time_ns())')" >> "$GITHUB_OUTPUT"

      - name: Start Compose environment
        run: make db-up

      - name: Wait for PostgreSQL to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q postgres)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "PostgreSQL did not become healthy in time" >&2
          exit 1

      - name: SQL smoke test
        run: |
          set -a
          . ./.env
          set +a
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT 1;" \
            -c "SELECT current_database();" \
            -c "SELECT current_user;"

      # Phase 3A: applies the versioned Flyway migrations
      # (database/migrations/) to the "reliability" schema and proves
      # real PostgreSQL persistence — schema/constraints/indexes exist,
      # a valid incident can be inserted and read back with the correct
      # defaults, invalid/duplicate data is rejected, migrations are
      # safe to rerun, and an inserted incident survives a graceful
      # PostgreSQL restart. Reuses the identical shared script used
      # locally (scripts/verify-persistence.sh) — no migration or test
      # logic duplicated in this workflow. Placed right after
      # PostgreSQL becomes healthy, before the application services'
      # own health waits, since it is independent of them.
      - name: Verify persistence (Phase 3A)
        run: ./scripts/verify-persistence.sh

      # Phase 7: provisions the dedicated, least-privileged
      # `agent_runtime` PostgreSQL role/schema (never the broad
      # POSTGRES_USER/POSTGRES_PASSWORD role) -- see
      # scripts/init-agent-runtime-db.sh. Requires PostgreSQL already
      # healthy and the Flyway migrations already applied (the Phase 3A
      # step just above), since this script issues real SQL via
      # `docker compose exec`. Idempotent; safe to rerun.
      - name: Initialize agent-runtime checkpoint database (Phase 7)
        run: ./scripts/init-agent-runtime-db.sh

      # Phase 7: a dedicated, REAL PostgreSQL proof -- never mocked --
      # that (1) the agent_runtime role is genuinely denied SELECT/
      # UPDATE on reliability.incidents, SELECT on
      # reliability.retrieval_chunks, and any mutation of
      # reliability.incident_events (test_db_privilege_boundary.py),
      # (2) a real LangGraph checkpoint survives destroying and
      # recreating the Python runtime instance and resumes to
      # completion from durable PostgreSQL state alone, not local
      # process memory (test_checkpoint_durability.py), and (3) --
      # post-commit fix, GitHub Actions run #33 -- the SAME
      # CheckpointStore (never recreated) recovers readiness after a
      # real PostgreSQL backend termination, with pre-existing
      # checkpoint data still readable and a new checkpoint still
      # writable afterward (test_checkpoint_pool_recovery.py). Uses the
      # service's own real build_graph/compile_graph, not a toy graph.
      # AGENT_RUNTIME_REQUIRE_REAL_DB=true makes this step FAIL
      # outright (never silently skip) if the database is somehow
      # unavailable here -- unlike the earlier "Run agent-runtime-
      # service tests" step above, which runs before PostgreSQL even
      # exists and is expected to skip these same tests.
      # Phase 8 extends this same real-database step with
      # test_remediation_durability.py -- the real LangGraph
      # interrupt/resume proof against the real AsyncPostgresSaver
      # (Phase 8's own explicit requirement: never InMemorySaver alone
      # for persistence/HITL durability tests). Same real
      # agent_runtime role/schema, no new database setup needed.
      - name: Verify real-database checkpoint durability and privilege boundary (Phase 7/8)
        working-directory: services/agent-runtime-service
        run: |
          set -a
          . ../../.env
          set +a
          AGENT_RUNTIME_REQUIRE_REAL_DB=true pytest tests/test_db_privilege_boundary.py tests/test_checkpoint_durability.py tests/test_checkpoint_pool_recovery.py tests/test_remediation_durability.py -v

      # Phase 6 correction round: a dedicated, REAL PostgreSQL
      # transaction-rollback regression -- never mocked -- proving
      # retrieval-service's atomic per-source indexing actually rolls
      # back a source's chunks (and leaves its previously-indexed rows
      # untouched) when a failure is injected mid-batch. See
      # services/retrieval-service/tests/test_db_transaction.py.
      # Deliberately placed HERE: the Phase 3A step just above already
      # ran `docker compose run --rm flyway migrate`, which picks up
      # every pending migration including
      # V5__create_retrieval_index.sql -- so by this point PostgreSQL
      # is healthy, V1-V5 are applied, and the pgvector extension and
      # reliability.retrieval_chunks both exist. Connects directly to
      # postgres's published host port (127.0.0.1:5432, this test's
      # own default) using the real POSTGRES_USER/PASSWORD/DB from
      # .env -- no retrieval-service container needs to be running for
      # this. Every row it touches is scoped under a run-unique
      # `test-atomic-*` source_key it creates and deletes itself; the
      # real corpus is never affected. RETRIEVAL_REQUIRE_REAL_DB=true
      # makes this step FAIL outright (never silently skip) if the
      # database is somehow unavailable here -- unlike the earlier
      # "Run retrieval-service tests" step above, which runs before
      # PostgreSQL even exists and is expected to skip these same
      # tests.
      - name: Verify real-database transaction rollback (Phase 6)
        working-directory: services/retrieval-service
        run: |
          set -a
          . ../../.env
          set +a
          RETRIEVAL_REQUIRE_REAL_DB=true pytest tests/test_db_transaction.py -v

      # Phase 8: a dedicated, REAL PostgreSQL proof -- never mocked --
      # of the remediation domain's own atomic/idempotent transaction
      # boundaries: idempotent proposal creation, approval atomic with
      # the incident investigating->remediating transition, rejection
      # never touching the incident, execution start/result
      # idempotency, and the failed-execution incident rollback
      # (remediating->investigating). See
      # services/control-plane/tests/test_remediation_transactions.py.
      # Placed here, alongside the Phase 6 real-database step above:
      # Flyway's own migrate step (Phase 3A, above) already applied
      # V6__create_remediation_schema.sql along with every other
      # pending migration, so reliability.remediation_proposals/
      # remediation_events already exist by this point.
      # CONTROL_PLANE_REQUIRE_REAL_DB=true makes this step FAIL
      # outright (never silently skip) if the database is somehow
      # unavailable here.
      - name: Verify real-database remediation transactions (Phase 8)
        working-directory: services/control-plane
        run: |
          set -a
          . ../../.env
          set +a
          CONTROL_PLANE_REQUIRE_REAL_DB=true pytest tests/test_remediation_transactions.py -v

      # Phase 3B: brings up the control-plane container (building its
      # image if not already built — the same implicit-build-on-`up`
      # pattern already used for the four demo services below, no
      # separate `docker compose build` step), re-applies migrations
      # idempotently (safe even though Phase 3A's step above already
      # did), and proves the real FastAPI service against the real
      # PostgreSQL reliability.incidents table end to end — insert via
      # SQL, fetch via HTTP, filters, pagination, ordering, 404/422,
      # read-only (no incidental writes), and recovery after a real
      # PostgreSQL restart. Reuses the identical shared script used
      # locally (scripts/verify-control-plane.sh) — no integration
      # logic duplicated in this workflow. Deliberately placed AFTER
      # the Phase 3A persistence verifier above (which itself restarts
      # PostgreSQL) completes, and before the four demo services' own
      # health waits, since it is independent of them.
      - name: Verify control plane (Phase 3B)
        run: ./scripts/verify-control-plane.sh

      # Phase 3C/3D: focused, fast webhook-ingestion acceptance — real
      # authentication (missing/wrong Bearer token), payload validation,
      # the real atomic PostgreSQL upsert/deduplication behavior
      # (incidents_active_fingerprint_uniq), transaction all-or-nothing
      # behavior, real source-driven resolution (including idempotent
      # duplicate resolution), and a real PostgreSQL outage returning
      # 503 — all POSTed directly to control-plane's own webhook
      # endpoint (not through Alertmanager; that's what the real alert
      # lifecycle step further below proves). Reuses the identical
      # shared script used locally (scripts/verify-webhook-ingestion.sh)
      # — no integration logic duplicated in this workflow. Placed
      # immediately after Phase 3B's own verifier, and well before the
      # expensive real Collector-outage lifecycle gate at the end of
      # this job.
      - name: Verify webhook ingestion (Phase 3C/3D)
        run: ./scripts/verify-webhook-ingestion.sh

      # Phase 3D: focused real PostgreSQL incident lifecycle
      # acceptance — the full state machine via the real PATCH
      # endpoint, optimistic concurrency (including a genuine
      # concurrent-request race with exactly one winner), real
      # PostgreSQL restart durability, and real occurrence-identity/
      # stale-replay handling via the real webhook endpoint. Reuses
      # the identical shared script used locally
      # (scripts/verify-incident-lifecycle.sh) — no integration logic
      # duplicated in this workflow. Does not touch otel-collector, so
      # placement relative to the Collector-outage gate doesn't matter;
      # kept here, alongside the other focused control-plane
      # verifiers, before the four demo services' own health waits.
      - name: Verify incident lifecycle (Phase 3D)
        run: ./scripts/verify-incident-lifecycle.sh

      # Phase 3E: focused real PostgreSQL audit-trail acceptance — the
      # V3 schema itself (constraints, index, append-only triggers),
      # correct event attribution for every accepted creation/
      # observation/operator-transition/automatic-resolution, zero
      # events for every rejected/ignored/no-op operation, a real
      # transactional-rollback proof, a genuine concurrent-PATCH race
      # producing exactly one event, and audit-trail restart
      # durability. Reuses the identical shared script used locally
      # (scripts/verify-incident-audit.sh) — no integration logic
      # duplicated in this workflow. Does not touch otel-collector, so
      # placement relative to the Collector-outage gate doesn't
      # matter; kept here, alongside the other focused control-plane
      # verifiers, before the four demo services' own health waits —
      # and, critically, before the expensive final alert-lifecycle
      # gate at the end of this job.
      - name: Verify incident audit trail (Phase 3E)
        run: ./scripts/verify-incident-audit.sh

      - name: Wait for checkout-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q checkout-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "checkout-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for checkout-service
        run: |
          body="$(curl -fsS http://localhost:8080/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "checkout-service"'

          actuator="$(curl -fsS http://localhost:8080/actuator/health)"
          echo "$actuator"
          echo "$actuator" | jq -e '.status == "UP"'

      - name: Wait for payment-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q payment-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "payment-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for payment-service
        run: |
          body="$(curl -fsS http://localhost:8081/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "payment-service"'

      - name: Wait for inventory-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q inventory-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "inventory-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for inventory-service
        run: |
          body="$(curl -fsS http://localhost:8082/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "inventory-service"'

      - name: Wait for notification-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q notification-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "notification-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for notification-service
        run: |
          body="$(curl -fsS http://localhost:8083/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "notification-service"'

      # Tempo has a real Docker-level healthcheck (its own "-health"
      # binary mode, see docker-compose.yml), unlike otel-collector. This
      # must run before the checkout smoke test below, so the checkout
      # trace it generates isn't exported before Tempo is ready to
      # receive it.
      - name: Wait for Tempo to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q tempo)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Tempo did not become healthy in time" >&2
          exit 1

      # Alertmanager has a real Docker-level healthcheck (its pinned
      # image has both a shell and wget, see docker-compose.yml).
      - name: Wait for Alertmanager to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q alertmanager)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Alertmanager did not become healthy in time" >&2
          exit 1

      # Loki's official image has no shell/curl/wget and no -health-style
      # CLI flag, so (like otel-collector) it has no Docker-level
      # healthcheck. Checked here, before the checkout smoke test below,
      # so Alloy has a ready Loki to ship the test app's logs to.
      - name: Wait for Loki to become ready
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if curl -fsS http://localhost:3100/ready >/dev/null 2>&1; then
              exit 0
            fi
            echo "Attempt $i/$attempts: Loki /ready not ready yet"
            sleep 3
          done
          echo "Loki /ready (localhost:3100) never responded" >&2
          exit 1

      # Alloy has a shell but no curl/wget, so likewise no Docker-level
      # healthcheck; verified via its own debug API instead, requiring
      # all 4 pipeline components (discovery.docker, discovery.relabel,
      # loki.source.docker, loki.write) to report healthy.
      - name: Wait for Alloy to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if body="$(curl -fsS http://localhost:12345/api/v0/web/components)" && echo "$body" | jq -e '
                (length >= 4) and (all(.[]; .health.state == "healthy"))
              ' >/dev/null 2>&1
            then
              echo "$body"
              exit 0
            fi
            echo "Attempt $i/$attempts: Alloy components not all healthy yet"
            sleep 3
          done
          echo "Alloy components (localhost:12345/api/v0/web/components) never all reported healthy" >&2
          exit 1

      - name: End-to-end checkout orchestration smoke test
        run: |
          body="$(curl -fsS -X POST http://localhost:8080/checkouts \
            -H 'Content-Type: application/json' \
            -d '{"sku":"sku_keyboard_001","quantity":2,"amount_cents":2599,"currency":"USD","recipient":"customer@example.com"}')"
          echo "$body"
          echo "$body" | jq -e '
            (.checkout_id | type == "string" and startswith("chk_"))
            and .status == "COMPLETED"
            and (.payment.payment_id | type == "string" and length > 0)
            and .payment.status == "AUTHORIZED"
            and (.inventory.reservation_id | type == "string" and length > 0)
            and .inventory.status == "RESERVED"
            and (.notification.notification_id | type == "string" and length > 0)
            and .notification.status == "ACCEPTED"
          '

      - name: Wait for Prometheus to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q prometheus)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Prometheus did not become healthy in time" >&2
          exit 1

      - name: Wait for Grafana to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q grafana)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Grafana did not become healthy in time" >&2
          exit 1

      # otel-collector's official image has no shell/wget/curl, so it has
      # no Docker-level healthcheck (see docker-compose.yml comment). Its
      # liveness is instead proven here: Prometheus can only report this
      # scrape target "up" if it actually reached the Collector over the
      # Compose network and got a valid response.
      - name: Verify Prometheus reports itself and the Collector as UP
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if body="$(curl -fsS http://localhost:9090/api/v1/targets)" && echo "$body" | jq -e '
                ([.data.activeTargets[] | select(.labels.job=="prometheus") | .health] | length > 0 and all(.[]; . == "up"))
                and
                ([.data.activeTargets[] | select(.labels.job=="otel-collector") | .health] | length > 0 and all(.[]; . == "up"))
                and
                ([.data.activeTargets[] | select(.labels.job=="otel-collector-app-metrics") | .health] | length > 0 and all(.[]; . == "up"))
              ' >/dev/null 2>&1
            then
              echo "$body"
              exit 0
            fi
            echo "Attempt $i/$attempts: prometheus/otel-collector/otel-collector-app-metrics targets not all UP yet"
            sleep 3
          done
          echo "Prometheus targets (prometheus, otel-collector, otel-collector-app-metrics) never all reported UP" >&2
          curl -fsS http://localhost:9090/api/v1/targets || true
          exit 1

      - name: Verify Grafana health and provisioned Prometheus + Tempo + Loki datasources
        run: |
          set -a
          . ./.env
          set +a

          health="$(curl -fsS http://localhost:3000/api/health)"
          echo "$health"
          echo "$health" | jq -e '.database == "ok"'

          datasources="$(curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" http://localhost:3000/api/datasources)"
          echo "$datasources"
          echo "$datasources" | jq -e '[.[] | select(.type == "prometheus" and .url == "http://prometheus:9090")] | length > 0'
          echo "$datasources" | jq -e '[.[] | select(.type == "tempo" and .url == "http://tempo:3200")] | length > 0'
          echo "$datasources" | jq -e '[.[] | select(.type == "loki" and .url == "http://loki:3100")] | length > 0'

      # The OTel Java agent's/Python SDK's/Go SDK's/Node SDK's metric
      # export interval and Prometheus's own scrape cycle are both
      # asynchronous, so this is retried rather than checked once
      # immediately after the smoke test above. Phase 2A.5 extends this
      # with notification-service's HTTP server metrics (the other three
      # services' checks are unchanged).
      - name: Verify all four application services' metrics reach Prometheus
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if server_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="checkout-service",http_route="/checkouts"}')" \
                && echo "$server_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1 \
                && client_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=count by (server_address) (http_client_request_duration_seconds_count{service_name="checkout-service"})')" \
                && echo "$client_body" | jq -e '
                    ([.data.result[].metric.server_address] | unique | sort) ==
                    ["inventory-service", "notification-service", "payment-service"]
                  ' >/dev/null 2>&1 \
                && payment_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="payment-service",http_route="/payments/authorize"}')" \
                && echo "$payment_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1 \
                && inventory_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="inventory-service",http_route="/inventory/reservations"}')" \
                && echo "$inventory_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1 \
                && notification_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="notification-service",http_route="/notifications"}')" \
                && echo "$notification_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1
            then
              echo "$server_body"
              echo "$client_body"
              echo "$payment_body"
              echo "$inventory_body"
              echo "$notification_body"
              exit 0
            fi
            echo "Attempt $i/$attempts: application service HTTP metrics not all in Prometheus yet"
            sleep 3
          done
          echo "one or more application services' metrics never appeared in Prometheus" >&2
          exit 1

      # There is no trace backend yet; traces are verified via the
      # Collector's debug exporter output in its own container logs.
      # Retried because the batch/span export delay is async for the
      # Java agent, the Python SDK, the Go SDK, and the Node SDK alike.
      # Phase 2A.5 extends the same generalized parser
      # (scripts/parse-checkout-trace.py) to require all three downstream
      # branches (payment, inventory, notification) — a COMPLETE
      # distributed trace across the whole checkout workflow, not just
      # that all four service names appear somewhere in the logs.
      - name: Verify checkout-service trace evidence and complete checkout distributed trace
        id: checkout-trace
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if logs="$(docker compose logs otel-collector 2>&1)" \
                && grep -qF 'service.name: Str(checkout-service)' <<<"$logs" \
                && grep -qF 'Name           : POST /checkouts' <<<"$logs" \
                && grep -qF 'Kind           : Server' <<<"$logs" \
                && grep -qF 'Kind           : Client' <<<"$logs" \
                && grep -qF 'url.full: Str(http://payment-service:8081/payments/authorize)' <<<"$logs" \
                && grep -qF 'url.full: Str(http://inventory-service:8082/inventory/reservations)' <<<"$logs" \
                && grep -qF 'url.full: Str(http://notification-service:8083/notifications)' <<<"$logs" \
                && checkout_trace_match="$(docker compose logs --no-log-prefix otel-collector | python3 scripts/parse-checkout-trace.py)"
            then
              echo "$checkout_trace_match"
              echo "match=$checkout_trace_match" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/$attempts: checkout trace evidence and/or complete checkout distributed trace correlation (payment + inventory + notification branches) not found yet"
            sleep 3
          done
          echo "checkout-service trace evidence and/or complete checkout distributed trace correlation never appeared in Collector logs" >&2
          exit 1

      # Phase 2B.1: independently re-verifies the exact same Trace ID and
      # seven Span IDs from the step above directly against Tempo's own
      # HTTP query API (GET /api/v2/traces/{traceID}), not just that the
      # Collector attempted to export them. Retried because Collector ->
      # Tempo export and Tempo's own ingest-to-query path are both async.
      - name: Verify checkout trace retrieval and validation from Tempo
        run: |
          match='${{ steps.checkout-trace.outputs.match }}'
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if tempo_match="$(python3 scripts/verify-tempo-trace.py --tempo-url http://localhost:3200 "$match")"; then
              echo "$tempo_match"
              exit 0
            fi
            echo "Attempt $i/$attempts: checkout trace not yet retrievable/valid from Tempo"
            sleep 3
          done
          echo "Tempo never served the real checkout trace with all seven spans and correct parent/child relationships" >&2
          exit 1

      # Phase 2B.2: proves genuine, non-synthetic log output from all
      # four application services was actually collected through the
      # Alloy -> Loki pipeline (Docker log discovery/shipping and Loki
      # indexing are both asynchronous, so this is retried). Reuses the
      # same validator (scripts/verify-loki-logs.py) as the local
      # verifier, so there is no duplicated validation logic between
      # local and CI. --after-ns requires evidence newer than the
      # run-start timestamp captured above (CI runners are ephemeral, so
      # this is mostly a consistency/defense-in-depth match with the
      # local verifier rather than addressing an observed CI failure).
      # The more expensive Loki restart-persistence test remains
      # local-only (scripts/verify-observability.sh); this step
      # independently proves all four services' logs are queryable.
      - name: Verify real application logs reach Loki
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if python3 scripts/verify-loki-logs.py --loki-url http://localhost:3100 --since-seconds 1800 --after-ns "${{ steps.run-start.outputs.ns }}"; then
              exit 0
            fi
            echo "Attempt $i/$attempts: real logs for all four services not yet queryable from Loki"
            sleep 3
          done
          echo "scripts/verify-loki-logs.py never confirmed real, nonempty logs from all four application services in Loki" >&2
          exit 1

      # Phase 2B.3: verifies the three auto-provisioned Grafana
      # dashboards through Grafana's real API (correct panels,
      # datasource references, template variables) and independently
      # re-executes every panel's own PromQL/LogQL query directly
      # against Prometheus and Loki. Reuses the same validator
      # (scripts/verify-grafana-dashboards.py) as the local verifier —
      # no duplicated validation logic. Runs after real checkout
      # traffic and log ingestion above, since several panels require
      # that data to already exist.
      - name: Verify Grafana dashboards
        run: |
          set -a
          . ./.env
          set +a

          attempts=20
          for i in $(seq 1 "$attempts"); do
            if python3 scripts/verify-grafana-dashboards.py \
                 --grafana-url http://localhost:3000 \
                 --user "$GRAFANA_ADMIN_USER" --password "$GRAFANA_ADMIN_PASSWORD" \
                 --prometheus-url http://localhost:9090 \
                 --loki-url http://localhost:3100
            then
              exit 0
            fi
            echo "Attempt $i/$attempts: Grafana dashboards not yet fully verifiable"
            sleep 3
          done
          echo "scripts/verify-grafana-dashboards.py never confirmed all three provisioned dashboards" >&2
          exit 1

      # Phase 2B.4: confirms Alertmanager itself is healthy and that
      # Prometheus actually loaded all four expected alert rules
      # (correct expressions, for: durations, labels, annotations),
      # each starting "inactive". Reuses scripts/verify-alerting.py —
      # no duplicated validation logic.
      - name: Verify Alertmanager health and alert rules loaded
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if python3 scripts/verify-alerting.py health --alertmanager-url http://localhost:9093 \
                 && python3 scripts/verify-alerting.py rules --prometheus-url http://localhost:9090
            then
              exit 0
            fi
            echo "Attempt $i/$attempts: Alertmanager health / Prometheus rule-loading not yet fully verifiable"
            sleep 3
          done
          echo "scripts/verify-alerting.py never confirmed Alertmanager health and all four expected alert rules loaded/inactive" >&2
          exit 1

      # Phase 2B.4 + Phase 3C: the alert lifecycle acceptance test —
      # proves a real Prometheus rule (TelemetryPipelineUnavailable)
      # goes inactive -> pending -> firing because of a genuine,
      # controlled failure (stopping otel-collector, never a rule-file
      # edit or a direct POST to Alertmanager's API), that the same
      # firing alert is independently observable through Alertmanager's
      # own API, and that both recover once otel-collector is
      # restarted. VERIFY_INGESTION=true additionally proves — using
      # this SAME real outage, not a second one — that Alertmanager's
      # real webhook delivery persisted the firing alert as a genuine,
      # correctly-mapped reliability.incidents row (see
      # scripts/verify-ingestion.py), AND (Phase 3D) that once the
      # Collector recovers and Alertmanager resolves, its real resolved
      # webhook delivery actually transitions that exact incident to
      # status=resolved with resolved_at populated, AND (Phase 3E) that
      # this exact real chain produced a genuine, correctly-attributed
      # audit trail (a 'created' event and a resolving
      # 'status_transition' event, both actor_type='alertmanager', no
      # fabricated operator intervention). Reuses the identical shared
      # script used locally (scripts/verify-alert-lifecycle.sh, which
      # itself reuses scripts/verify-alerting.py for all Prometheus/
      # Alertmanager HTTP API validation) — no lifecycle, ingestion,
      # resolution, or audit logic duplicated in this workflow. That
      # script restores otel-collector via its own EXIT trap if it
      # fails partway through, so a failure here never leaves the
      # Collector stopped. Runs after every other telemetry/dashboard
      # step above (and after the focused Phase 3C/3D/3E webhook-
      # ingestion, incident-lifecycle, and incident-audit steps above),
      # since stopping otel-collector would otherwise invalidate them.
      - name: Run alert lifecycle + ingestion + resolution + audit acceptance test
        run: VERIFY_INGESTION=true bash scripts/verify-alert-lifecycle.sh

      # Phase 5 correction round: a timestamp checkpoint captured
      # IMMEDIATELY BEFORE the Phase 4 step below, exported to every
      # later step via $GITHUB_ENV. The Phase 5 step further down
      # requires the incident it reuses to have a first_seen_at AFTER
      # this checkpoint -- proving it was genuinely produced by THIS
      # job's own Phase 4 run, not a stale incident from an earlier one.
      - name: Capture Phase 5 freshness checkpoint
        run: echo "PHASE5_FRESHNESS_CHECKPOINT=$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())')" >> "$GITHUB_ENV"

      # Phase 4: real controlled failure injection against payment-service
      # and inventory-service (never postgres, never otel-collector).
      # Deliberately placed AFTER the Collector-outage gate above, so
      # this phase's own real outages cannot interfere with that gate's
      # preconditions. payment-outage's --full-acceptance proves the
      # real Prometheus CheckoutServerErrors -> Alertmanager webhook ->
      # incident -> audit -> recovery chain (its own, separate alert
      # rule and real failure mechanism — no second Collector outage);
      # inventory-outage runs its own deterministic checks only. See
      # scripts/verify-failure-simulation.sh and
      # docs/architecture/phase-4-failure-simulation.md.
      - name: Verify failure simulation (Phase 4)
        timeout-minutes: 15
        run: bash scripts/verify-failure-simulation.sh

      # Phase 5: the read-only AI investigator's real-evidence
      # acceptance gate. Deliberately placed AFTER the Phase 4 gate
      # above so it can reuse the real, already-persisted, resolved
      # CheckoutServerErrors incident that run just produced, rather
      # than causing another real outage. PHASE5_FRESHNESS_CHECKPOINT
      # (captured above, before Phase 4 even ran) makes this a
      # freshness-PROVEN reuse, not merely an assumed one. Forces
      # INVESTIGATOR_LLM_PROVIDER=stub for this run only (captured
      # original mode restored and verified afterward) so this
      # exercises the real control-plane/Prometheus/Loki/Tempo evidence
      # pipeline end-to-end without a real, paid LLM API key -- no
      # credentials are configured or required in CI. See
      # scripts/verify-investigator.sh and
      # docs/architecture/phase-5-ai-investigator.md.
      - name: Verify investigator (Phase 5)
        timeout-minutes: 5
        run: bash scripts/verify-investigator.sh

      # Phase 6: the RAG retrieval acceptance gate. Deliberately placed
      # AFTER both the Phase 4 and Phase 5 gates above, reusing the
      # exact same real, already-persisted, resolved
      # CheckoutServerErrors incident (and the SAME
      # PHASE5_FRESHNESS_CHECKPOINT captured once, before Phase 4) --
      # no new outage, no new checkpoint mechanism. Sources
      # scripts/verify-investigator.sh for its reusable helpers rather
      # than duplicating them. Uses only the deterministic local
      # embedding provider (default) and the deterministic stub LLM
      # provider (forced temporarily, restored and verified
      # afterward, same as Phase 5) -- no credentials configured or
      # required in CI. See scripts/verify-rag.sh and
      # docs/architecture/phase-6-rag-retrieval.md.
      - name: Verify RAG retrieval (Phase 6)
        timeout-minutes: 10
        run: bash scripts/verify-rag.sh

      # Phase 7: the durable LangGraph agent-runtime acceptance gate.
      # Deliberately placed AFTER the Phase 6 gate above, reusing the
      # exact same real, already-persisted, resolved
      # CheckoutServerErrors incident (and the SAME
      # PHASE5_FRESHNESS_CHECKPOINT captured once, before Phase 4) --
      # no new outage, no new checkpoint mechanism. Sources
      # scripts/verify-rag.sh (which itself sources
      # scripts/verify-investigator.sh) for its reusable helpers rather
      # than duplicating them. Uses the same deterministic stub LLM
      # provider machinery as Phase 5/6 (forced temporarily, restored
      # and verified afterward) -- no credentials configured or
      # required in CI. See scripts/verify-agent-runtime.sh and
      # docs/architecture/phase-7-durable-agent-runtime.md.
      - name: Verify agent runtime (Phase 7)
        timeout-minutes: 10
        run: bash scripts/verify-agent-runtime.sh

      # Phase 8: human-approved remediation acceptance. Deliberately
      # placed AFTER the Phase 7 gate above, but creates its OWN FRESH
      # incident (never reuses Phase 4's already-resolved one -- Phase
      # 8 is a MUTATING demo and must prove its own real chain: a real
      # checkout failure induced by the controlled payment
      # authorization fault, a real Prometheus/Alertmanager alert, a
      # real human-approved remediation proposal, real tool-gateway
      # execution, real recovery, and the SAME incident naturally
      # resolving via Alertmanager's own real webhook). Sources
      # scripts/verify-agent-runtime.sh (which itself sources
      # scripts/verify-rag.sh -> scripts/verify-investigator.sh) and
      # scripts/simulate-failure.sh for their reusable helpers rather
      # than duplicating them. Uses the same deterministic stub LLM
      # provider machinery as Phase 5/6/7 -- no credentials configured
      # or required in CI. See scripts/verify-remediation.sh and
      # docs/architecture/phase-8-human-approval-remediation.md.
      - name: Verify remediation (Phase 8)
        timeout-minutes: 20
        run: bash scripts/verify-remediation.sh

      - name: Show service logs
        if: always()
        run: |
          docker compose logs --tail=100 postgres
          docker compose logs --tail=100 control-plane
          docker compose logs --tail=100 checkout-service
          docker compose logs --tail=100 investigator-service
          docker compose logs --tail=100 retrieval-service
          docker compose logs --tail=100 agent-runtime-service
          docker compose logs --tail=100 tool-gateway
          docker compose logs --tail=100 payment-service
          docker compose logs --tail=100 inventory-service
          docker compose logs --tail=100 notification-service
          docker compose logs --tail=100 otel-collector
          docker compose logs --tail=100 prometheus
          docker compose logs --tail=100 grafana
          docker compose logs --tail=100 tempo
          docker compose logs --tail=100 loki
          docker compose logs --tail=100 alloy
          docker compose logs --tail=100 alertmanager

      - name: Stop Compose environment (preserve volumes)
        if: always()
        run: docker compose down

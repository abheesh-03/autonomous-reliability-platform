name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    # Raised from 20: Phase 4's real acceptance step (CheckoutServerErrors'
    # real 5-minute rate() decay on recovery) alone measured ~8-9 minutes
    # locally, on top of the pre-existing Collector-outage gate and every
    # build/test step.
    # Raised from 35: Phase 5's own step adds a few more minutes on
    # top of Phase 4's real multi-minute CheckoutServerErrors
    # firing/recovery wait.
    # Raised from 40: Phase 6's own step (indexing + search + one more
    # RAG-integrated investigation) measured well under a minute
    # locally, but a generous margin is kept for CI runner variance.
    # Raised from 45: Phase 7 adds a real PostgreSQL checkpoint-
    # durability/privilege-boundary test step plus its own real
    # acceptance gate (agent run creation, restart, resume) -- measured
    # well under two minutes combined locally, generous margin kept.
    # Raised from 50: Phase 8 adds tool-gateway's own Go
    # gofmt/vet/test/build, a real PostgreSQL remediation-transaction
    # test step, and its own real acceptance gate (sustained real 5xx
    # traffic until CheckoutServerErrors fires, then its own real
    # ~5-minute rate() decay back to inactive -- the same documented
    # multi-minute wait scripts/simulate-failure.sh's own
    # payment-outage --full-acceptance already budgets for this exact
    # alert) -- measured several minutes locally, generous margin kept
    # for CI runner variance.
    # Raised from 65: the Phase 9 completion pass adds its own real,
    # browser-driven end-to-end acceptance step (scripts/verify-web-console.sh)
    # -- a SECOND real CheckoutServerErrors fire/recover cycle (its own
    # fresh incident, same real alert, same ~5-minute rate() decay),
    # driven through an actual Chromium browser session rather than
    # curl -- measured ~8 minutes locally end to end, generous margin
    # kept for CI runner variance and the Chromium download/launch
    # overhead.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check shell script syntax
        run: bash -n scripts/check-env.sh && bash -n scripts/verify-persistence.sh && bash -n scripts/verify-control-plane.sh && bash -n scripts/init-webhook-secret.sh && bash -n scripts/verify-webhook-ingestion.sh && bash -n scripts/verify-alert-lifecycle.sh && bash -n scripts/verify-incident-lifecycle.sh && bash -n scripts/verify-incident-audit.sh && bash -n scripts/simulate-failure.sh && bash -n scripts/test-simulate-failure.sh && bash -n scripts/verify-failure-simulation.sh && bash -n scripts/test-failure-simulation-settling.sh && bash -n scripts/test-canonical-incident-selection.sh && bash -n scripts/verify-investigator.sh && bash -n scripts/test-verify-investigator-restore.sh && bash -n scripts/verify-rag.sh && bash -n scripts/init-agent-runtime-db.sh && bash -n scripts/verify-agent-runtime.sh && bash -n scripts/test-db-up-order.sh && bash -n scripts/test-init-agent-runtime-db-fresh.sh && bash -n scripts/apply-web-console-auth-schema.sh && bash -n scripts/init-web-console-db.sh && bash -n scripts/test-web-console-auth-schema-ownership.sh && bash -n scripts/init-remediation-secrets.sh && bash -n scripts/verify-remediation.sh && bash -n scripts/test-remediation-cleanup-resilience.sh && bash -n scripts/verify-web-console.sh && bash -n scripts/verify-evals-offline.sh

      - name: Verify Makefile is usable
        run: make help

      # Phase 4: scenario-selection/safety-check/restoration-behavior
      # tests for scripts/simulate-failure.sh. No Docker/Compose stack
      # needed — every case here either exits during argument parsing
      # (before any Docker call) or exercises restore_target() with
      # docker stubbed. See scripts/test-simulate-failure.sh.
      - name: Run failure-simulation focused tests (Phase 4)
        run: make test-failure-simulation

      # CI cross-phase stabilization audit (post-run-#37) fix: a
      # static, no-Docker regression proving
      # verify-failure-simulation.sh's confirm_inventory_outage_convergence
      # (the real function, extracted and exercised directly) correctly
      # distinguishes the firing vs. non-firing inventory-outage paths,
      # polls incident-after/confirm-resolved to full convergence when
      # firing occurred, and requires a bounded, repeated-observation
      # database stability window on BOTH paths before ever succeeding
      # -- never a false success, never an early/late return. See
      # scripts/test-failure-simulation-settling.sh.
      - name: Run failure-simulation settling/convergence focused test (Phase 4)
        run: make test-failure-simulation-settling

      # CI cross-phase stabilization audit, Part D: a static,
      # no-Docker regression proving the centralized
      # select_canonical_phase4_incident_id helper (now shared by
      # verify-investigator.sh/verify-rag.sh/verify-agent-runtime.sh)
      # deterministically selects payment-outage's own earlier
      # incident over inventory-outage's own later one in
      # freshness-proven mode, regardless of list order, and fails
      # closed (never silently picks one) on a genuine tie. See
      # scripts/test-canonical-incident-selection.sh.
      - name: Run canonical-incident-selection focused test (Phase 4/5/6/7)
        run: make test-canonical-incident-selection

      # Phase 7 correction round (finding #1): a static, no-Docker
      # regression test proving db-up's recipe provisions
      # agent-runtime-service's real checkpoint-database credential
      # BEFORE the full `docker compose up -d` that actually CREATES
      # that container -- see scripts/test-db-up-order.sh and the
      # Makefile's own db-up ordering comment.
      - name: Run db-up ordering focused test (Phase 7)
        run: make test-db-up-order

      # Phase 8 correction round (finding #8): a static, no-Docker
      # regression proving verify-remediation.sh's own EXIT cleanup
      # trap tolerates a simulated payment_fault_get failure (e.g. a
      # genuinely unreachable payment-service) without aborting early
      # under `set -euo pipefail` -- every remaining restoration step
      # still runs, and cleanup still forces a nonzero exit status. See
      # scripts/test-remediation-cleanup-resilience.sh.
      - name: Run remediation cleanup resilience focused test (Phase 8)
        run: ./scripts/test-remediation-cleanup-resilience.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build checkout-service
        working-directory: services/checkout-service
        run: ./mvnw -B -DskipTests package

      - name: Run checkout-service tests
        working-directory: services/checkout-service
        run: ./mvnw -B test

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install payment-service dependencies
        working-directory: services/payment-service
        run: pip install -e ".[dev]"

      - name: Run payment-service tests
        working-directory: services/payment-service
        run: pytest -v

      # Phase 3B: unit tests only (fake repository, no real database —
      # see services/control-plane/tests/conftest.py). Reuses the same
      # Python 3.13 setup as payment-service above, no second
      # setup-python step needed.
      - name: Install control-plane dependencies
        working-directory: services/control-plane
        run: pip install -e ".[dev]"

      - name: Run control-plane tests
        working-directory: services/control-plane
        run: pytest -v

      # Phase 5: unit tests only -- httpx.MockTransport/fake client
      # doubles and the deterministic StubProvider (see
      # services/investigator-service/tests/), never a real network
      # call and never a real, paid LLM API call. Reuses the same
      # Python 3.13 setup above.
      - name: Install investigator-service dependencies
        working-directory: services/investigator-service
        run: pip install -e ".[dev]"

      - name: Run investigator-service tests
        working-directory: services/investigator-service
        run: pytest -v

      # Phase 5 correction round (issue 4): scripts/verify-investigator.sh's
      # on_exit provider-restoration logic, unit-tested in isolation
      # with docker/wait_healthy/investigator_provider_mode stubbed.
      # No Docker, Compose, or running stack needed -- see
      # scripts/test-verify-investigator-restore.sh.
      - name: Run investigator provider-restoration focused tests (Phase 5)
        run: make test-verify-investigator-restore

      # Phase 6: unit tests only -- httpx.MockTransport, monkeypatched
      # db.py functions, and the deterministic LocalLexicalEmbeddingProvider
      # (see services/retrieval-service/tests/), never a real database
      # connection and never a real, paid embedding API call. Reuses
      # the same Python 3.13 setup above. The deterministic retrieval-
      # quality smoke test resolves the real knowledge/runbooks/
      # corpus via a relative path from this checked-out repo (no
      # Docker mount needed here, unlike the local `make
      # retrieval-test` target, since this step already runs directly
      # against the full checkout).
      - name: Install retrieval-service dependencies
        working-directory: services/retrieval-service
        run: pip install -e ".[dev]"

      - name: Run retrieval-service tests
        working-directory: services/retrieval-service
        run: pytest -v

      # Phase 7: unit tests only -- fake control-plane/investigator
      # client doubles and InMemorySaver (Phase 7 §LANGGRAPH: allowed
      # for focused unit tests where persistence is not under test;
      # see services/agent-runtime-service/tests/), never a real
      # database connection. Reuses the same Python 3.13 setup above.
      # AGENT_RUNTIME_REQUIRE_REAL_DB is intentionally NOT set here, so
      # the real-database tests (test_db_privilege_boundary.py,
      # test_checkpoint_durability.py, test_checkpoint_pool_recovery.py)
      # skip cleanly -- PostgreSQL doesn't exist yet at this point in
      # the job. See the dedicated
      # real-database step further below, after Phase 3A migrations are
      # applied and the agent_runtime role/schema are provisioned.
      - name: Install agent-runtime-service dependencies
        working-directory: services/agent-runtime-service
        run: pip install -e ".[dev]"

      - name: Run agent-runtime-service tests
        working-directory: services/agent-runtime-service
        run: pytest -v

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: services/inventory-service/go.mod

      - name: Check inventory-service formatting
        working-directory: services/inventory-service
        run: test -z "$(gofmt -l .)"

      - name: Run inventory-service go vet
        working-directory: services/inventory-service
        run: go vet ./...

      - name: Run inventory-service tests
        working-directory: services/inventory-service
        run: go test ./...

      - name: Build inventory-service binary
        working-directory: services/inventory-service
        run: CGO_ENABLED=0 GOOS=linux go build -o /tmp/inventory-service ./cmd/inventory-service

      # Phase 8: tool-gateway, the ninth backend service -- reuses the
      # SAME Go 1.27 toolchain just set up above (no second
      # actions/setup-go step needed; this module has no external
      # dependencies at all, so there is nothing for a separate
      # cache-dependency-path to cache either). gofmt/vet/test/build,
      # same discipline as inventory-service above.
      - name: Check tool-gateway formatting
        working-directory: services/tool-gateway
        run: test -z "$(gofmt -l .)"

      - name: Run tool-gateway go vet
        working-directory: services/tool-gateway
        run: go vet ./...

      - name: Run tool-gateway tests
        working-directory: services/tool-gateway
        run: go test ./...

      - name: Build tool-gateway binary
        working-directory: services/tool-gateway
        run: CGO_ENABLED=0 GOOS=linux go build -o /tmp/tool-gateway ./cmd/tool-gateway

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json

      - name: Install notification-service dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Run notification-service typecheck
        working-directory: services/notification-service
        run: npm run typecheck

      - name: Run notification-service tests
        working-directory: services/notification-service
        run: npm test

      - name: Build notification-service
        working-directory: services/notification-service
        run: npm run build

      # Phase 9 Stage 1: web-console, the tenth backend/frontend
      # service -- reuses the SAME Node 24 toolchain just set up above
      # (no second actions/setup-node step needed; its own
      # package-lock.json just isn't covered by the cache-dependency-path
      # above, so its own npm ci below gets no cache hit -- a minor
      # performance nuance, not a correctness issue). Stage 1 is a
      # health-only shell: no backend calls, no operator credentials, so
      # these steps need nothing from the Compose/.env setup below.
      - name: Install web-console dependencies
        working-directory: services/web-console
        run: npm ci

      - name: Run web-console typecheck
        working-directory: services/web-console
        run: npm run typecheck

      - name: Run web-console lint
        working-directory: services/web-console
        run: npm run lint

      - name: Run web-console tests
        working-directory: services/web-console
        run: npm test

      # Post-commit fix (GitHub Actions run #39976783998): lib/auth/auth.ts
      # constructs its Better Auth instance eagerly at MODULE LOAD time
      # (`export const auth = betterAuth({ secret: requiredEnv("BETTER_AUTH_SECRET"), ... })`)
      # -- so `next build`'s route-configuration-collection phase throws
      # the moment it imports that module graph (every route importing
      # lib/server/actor.ts, transitively), regardless of whether any
      # real auth/database operation ever runs. This happens BEFORE
      # this job's own "Create runtime .env from .env.example" step
      # further below, so no .env-sourced value is available here yet
      # -- and must never be, since this step performs no real
      # database write and needs no PERSISTENT secret at all, only a
      # value satisfying the constructor's own non-empty check.
      #
      # A cryptographically random, ephemeral, build-only value --
      # generated fresh in this one step's own subshell via Node's
      # built-in `crypto` module (already guaranteed present; Node was
      # just set up above, so this adds no new tool dependency the way
      # shelling out to `openssl` would) -- is scoped to this single
      # `run:` invocation's process only. It is never exported to
      # $GITHUB_ENV, never written to any file, never logged (GitHub
      # Actions never echoes a command-substitution's resolved value,
      # only the literal command text), never read anywhere else in
      # this job, and does not appear in any generated .next/ build
      # artifact (verified directly: this exact value's own session-
      # signing use never touches a static asset, a NEXT_PUBLIC_
      # variable, or any rendered component). It is NEVER used for an
      # actual user session -- the real runtime container
      # (docker-compose.yml's web-console service, started later in
      # this job via `make db-up`) reads its own separate,
      # persistent BETTER_AUTH_SECRET from the real .env file created
      # by scripts/init-web-console-db.sh, completely independent of
      # this build-time value.
      - name: Build web-console
        working-directory: services/web-console
        run: |
          BETTER_AUTH_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" \
            npm run build

      # Phase 10: deterministic offline AI evaluation -- deliberately
      # placed HERE, as the fast offline gate BEFORE the expensive
      # Docker/Compose acceptance section below (per this phase's own
      # CI-placement requirement), reusing the SAME Python 3.13
      # interpreter and the SAME already-installed, already-editable
      # investigator-service/retrieval-service/agent-runtime-service
      # packages the "Install X dependencies"/"Run X tests" steps
      # above already set up earlier in this job -- no second install
      # of any of them, no Docker, no database, no real LLM/embedding
      # API call, no privileged production credential. Only this
      # harness's own minimal pytest/pytest-asyncio dev dependency is
      # installed here. See scripts/verify-evals-offline.sh (the
      # equivalent LOCAL, Docker-wrapped convenience for a developer
      # who may not have Python 3.13 natively) and
      # docs/architecture/phase-10-ai-evaluation.md.
      - name: Install Phase 10 evaluation harness dependencies
        run: pip install -q -r evals/requirements.txt

      - name: Run Phase 10 deterministic offline AI evaluation
        run: python -m evals.runner

      - name: Run Phase 10 evaluation harness's own unit/regression/negative-control tests
        run: python -m pytest evals/tests -c evals/pyproject.toml -v

      # Phase 11A: incident intelligence catalog -- deliberately placed
      # HERE, immediately after Phase 10's own fast offline gate and
      # still BEFORE the expensive Docker/Compose acceptance section
      # below (same placement rationale as Phase 10's own comment
      # above). Reuses the same Python 3.13 interpreter already set up
      # for Phase 10; pydantic==2.13.5 and pytest==9.1.1 are already
      # installed transitively (the same pins catalog/requirements.txt
      # itself specifies), so this install is a no-op confirmation, not
      # a second real dependency resolution. No Docker, no database, no
      # LLM/embedding API call, no production credential -- this step
      # only parses/validates/audits catalog/'s own synthetic and
      # source-controlled data, and never touches services/**,
      # database/**, observability/**, knowledge/**, or evals/**. See
      # scripts/verify-incident-catalog.sh (the equivalent LOCAL,
      # Docker-wrapped convenience) and
      # docs/architecture/phase-11a-incident-intelligence.md.
      - name: Install Phase 11A catalog dependencies
        run: pip install -q -r catalog/requirements.txt

      - name: Run Phase 11A catalog test suite (Gates B-G)
        run: python -m pytest catalog/tests -v

      - name: Run Phase 11A catalog CLI (build/validate/audit/coverage) against the real source
        run: |
          python -m catalog build
          python -m catalog validate
          python -m catalog audit
          python -m catalog coverage

      # Phase 11B: autonomous failure discovery (detectors/) --
      # deliberately placed HERE, immediately after Phase 11A's own
      # fast offline gate and still BEFORE the expensive Docker/
      # Compose acceptance section below (same placement rationale as
      # Phase 10/11A's own comments above). Reuses the same Python 3.13
      # interpreter already set up; pydantic==2.13.5/httpx==0.28.1/
      # pytest==9.1.1/pytest-asyncio==1.4.0 are already installed
      # transitively (the same pins detectors/requirements.txt itself
      # specifies, and evals/requirements.txt already installed
      # earlier in this job). No Docker,
      # no database, no live Prometheus/Tempo/control-plane, no
      # production credential -- every detectors/ test runs against
      # synthetic (httpx.MockTransport) data only, and this step never
      # touches services/**, database/**, observability/**,
      # knowledge/**, evals/**, or catalog/source/**. See
      # scripts/verify-detectors-offline.sh (the equivalent LOCAL,
      # Docker-wrapped convenience) and
      # docs/architecture/phase-11b-autonomous-failure-discovery.md.
      - name: Install Phase 11B detectors dependencies
        run: pip install -q -r detectors/requirements.txt

      - name: Run Phase 11B detectors test suite (anomaly/dependency/invariant/correlation/pipeline/CLI/safety)
        run: python -m pytest detectors/tests -c detectors/pyproject.toml -v

      - name: Run Phase 11B detectors CLI (verify + replay) fully offline
        run: |
          python -m detectors verify
          python -m detectors replay --fixture detectors/tests/fixtures/cascading_failure.json

      - name: Create runtime .env from .env.example
        run: cp .env.example .env

      # Phase 3C/3D: generates the local Bearer tokens control-plane's
      # two trusted write endpoints require — CONTROL_PLANE_WEBHOOK_TOKEN
      # (Alertmanager's webhook, also mirrored into
      # observability/alertmanager/secrets/webhook-token) and
      # CONTROL_PLANE_LIFECYCLE_TOKEN (the separate human/operator
      # PATCH /api/v1/incidents/{id}/status credential, .env only — see
      # scripts/init-webhook-secret.sh). Must run before Compose config
      # validation/startup below, since docker-compose.yml reads both
      # (each with an empty-string default, so this step isn't strictly
      # required for `docker compose config` to succeed, but IS
      # required for either endpoint to actually work once control-plane
      # starts). This step is also the webhook token's permission
      # PREFLIGHT: the script's final action runs the real, pinned
      # prom/alertmanager:v0.34.1 image, as its real non-root user
      # ("nobody", uid/gid 65534), against the freshly-written token
      # file and confirms it is actually readable — failing this step
      # closed, before any container starts, rather than only
      # discovering a host-permission mismatch once Alertmanager tries
      # and fails to deliver a real webhook later in this job. Never
      # prints either token's contents, on a fresh runner (no prior
      # .env or secrets/ directory) or an existing one alike.
      - name: Initialize webhook + lifecycle secrets (Phase 3C/3D)
        run: ./scripts/init-webhook-secret.sh

      # Phase 8: generates the six remediation Bearer tokens (see
      # scripts/init-remediation-secrets.sh). Same reasoning as the
      # webhook/lifecycle step above -- must exist before any container
      # that reads one of them is ever created. `make db-up` below
      # calls this same idempotent script again as part of its own
      # recipe; running it explicitly here first is the same
      # established double-call pattern the webhook/lifecycle step
      # above already uses.
      - name: Initialize remediation secrets (Phase 8)
        run: ./scripts/init-remediation-secrets.sh

      - name: Validate Docker Compose configuration
        run: docker compose config

      # Post-commit fix (GitHub Actions run #32): this is the exact
      # regression that run failed on -- a genuinely fresh runner's
      # PostgreSQL volume has no Flyway-owned `reliability` schema yet,
      # and scripts/init-agent-runtime-db.sh's own defense-in-depth
      # REVOKEs used to reference it unconditionally, failing outright
      # ("ERROR: schema "reliability" does not exist"). This was hidden
      # locally by a developer's preserved volume that already has
      # `reliability` from earlier phases. Runs the REAL, unmodified
      # init script against a real, but completely isolated and
      # temporary PostgreSQL instance (its own COMPOSE_PROJECT_NAME/
      # POSTGRES_PORT, cleaned up via its own EXIT trap) -- never this
      # job's own `postgres` service, which `make db-up` has not even
      # started yet at this point in the job. Placed here, BEFORE
      # `make db-up` below, specifically to catch this exact failure
      # mode before it can reproduce in that step again.
      - name: Verify init-agent-runtime-db.sh on a genuinely fresh database (Phase 7)
        run: make test-init-agent-runtime-db-fresh

      # CI preflight fix (Gate 2, independently reproduced): the
      # pre-fix scripts/apply-web-console-auth-schema.sh applied
      # Better Auth's schema connected as $POSTGRES_USER (the shared,
      # broad role), leaving every auth.* table owned by it instead of
      # web_console -- web_console (the role Better Auth's own Pool
      # connection, and control-plane's cross-schema membership
      # re-check, both actually use) then had NO select/insert/update/
      # delete privilege on any of them. Owning the `auth` SCHEMA does
      # not grant privilege on a TABLE a different role creates inside
      # it. Runs the REAL, unmodified scripts/init-web-console-db.sh +
      # apply-web-console-auth-schema.sh against a real, but
      # completely isolated and temporary PostgreSQL instance (its own
      # COMPOSE_PROJECT_NAME/POSTGRES_PORT, cleaned up via its own EXIT
      # trap) -- never this job's own `postgres` service, which `make
      # db-up` has not even started yet. Placed here, immediately
      # after its Phase 7 sibling and BEFORE `make db-up` below,
      # specifically to catch this exact failure mode before it can
      # reproduce in a later, far more expensive step (e.g. the
      # Playwright browser E2E, which actually exercises Better Auth's
      # real database reads/writes).
      - name: Verify web-console auth schema table ownership on a genuinely fresh database (CI preflight)
        run: make test-web-console-auth-schema-ownership

      # CI preflight fix (Gate 1, independently reproduced): the
      # separate `docker compose build`/`up` path below builds
      # services/web-console/Dockerfile with its own `RUN npm run
      # build`, completely independent of this job's EARLIER "Build
      # web-console" step above (a plain host `npm run build`, which
      # passes its own ephemeral BETTER_AUTH_SECRET already). The
      # Dockerfile's build previously had no such value at all, and
      # `next build`'s route-collection phase throws without one --
      # this was never caught by the earlier host build succeeding,
      # since Docker's own builder stage re-runs `npm run build` from
      # scratch in a separate environment. This static, offline check
      # catches a future accidental removal of that value from the
      # Dockerfile immediately, rather than only much later when the
      # expensive Compose build step actually fails.
      - name: Verify web-console Dockerfile provides a build-time BETTER_AUTH_SECRET (CI preflight)
        run: |
          grep -qE 'RUN\s+BETTER_AUTH_SECRET=.*npm run build' services/web-console/Dockerfile \
            || { echo "FAIL: services/web-console/Dockerfile's build stage no longer provides an ephemeral BETTER_AUTH_SECRET to 'npm run build' -- its route-collection phase will throw at Docker build time (see this Dockerfile's own header comment)."; exit 1; }
          echo "confirmed: services/web-console/Dockerfile's builder stage provides a build-time BETTER_AUTH_SECRET"

      # Captured before anything starts, so it pre-dates every
      # container's own first log line. Passed to the Loki log-evidence
      # step below (--after-ns) so that check requires genuinely fresh
      # ingestion during this run, not just any entry in a lookback
      # window (matching the same pattern used in
      # scripts/verify-observability.sh). Portable across macOS/Linux
      # runners: unlike `date +%s%N` (whose `%N` is GNU-only and
      # silently broken on macOS/BSD date), Python's time.time_ns()
      # behaves identically everywhere.
      - name: Capture run-start timestamp
        id: run-start
        run: echo "ns=$(python3 -c 'import time; print(time.time_ns())')" >> "$GITHUB_OUTPUT"

      - name: Start Compose environment
        run: make db-up

      - name: Wait for PostgreSQL to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q postgres)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "PostgreSQL did not become healthy in time" >&2
          exit 1

      - name: SQL smoke test
        run: |
          set -a
          . ./.env
          set +a
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT 1;" \
            -c "SELECT current_database();" \
            -c "SELECT current_user;"

      # Phase 3A: applies the versioned Flyway migrations
      # (database/migrations/) to the "reliability" schema and proves
      # real PostgreSQL persistence — schema/constraints/indexes exist,
      # a valid incident can be inserted and read back with the correct
      # defaults, invalid/duplicate data is rejected, migrations are
      # safe to rerun, and an inserted incident survives a graceful
      # PostgreSQL restart. Reuses the identical shared script used
      # locally (scripts/verify-persistence.sh) — no migration or test
      # logic duplicated in this workflow. Placed right after
      # PostgreSQL becomes healthy, before the application services'
      # own health waits, since it is independent of them.
      - name: Verify persistence (Phase 3A)
        run: ./scripts/verify-persistence.sh

      # Phase 7: provisions the dedicated, least-privileged
      # `agent_runtime` PostgreSQL role/schema (never the broad
      # POSTGRES_USER/POSTGRES_PASSWORD role) -- see
      # scripts/init-agent-runtime-db.sh. Requires PostgreSQL already
      # healthy and the Flyway migrations already applied (the Phase 3A
      # step just above), since this script issues real SQL via
      # `docker compose exec`. Idempotent; safe to rerun.
      - name: Initialize agent-runtime checkpoint database (Phase 7)
        run: ./scripts/init-agent-runtime-db.sh

      # Phase 7: a dedicated, REAL PostgreSQL proof -- never mocked --
      # that (1) the agent_runtime role is genuinely denied SELECT/
      # UPDATE on reliability.incidents, SELECT on
      # reliability.retrieval_chunks, and any mutation of
      # reliability.incident_events (test_db_privilege_boundary.py),
      # (2) a real LangGraph checkpoint survives destroying and
      # recreating the Python runtime instance and resumes to
      # completion from durable PostgreSQL state alone, not local
      # process memory (test_checkpoint_durability.py), and (3) --
      # post-commit fix, GitHub Actions run #33 -- the SAME
      # CheckpointStore (never recreated) recovers readiness after a
      # real PostgreSQL backend termination, with pre-existing
      # checkpoint data still readable and a new checkpoint still
      # writable afterward (test_checkpoint_pool_recovery.py). Uses the
      # service's own real build_graph/compile_graph, not a toy graph.
      # AGENT_RUNTIME_REQUIRE_REAL_DB=true makes this step FAIL
      # outright (never silently skip) if the database is somehow
      # unavailable here -- unlike the earlier "Run agent-runtime-
      # service tests" step above, which runs before PostgreSQL even
      # exists and is expected to skip these same tests.
      # Phase 8 extends this same real-database step with
      # test_remediation_durability.py -- the real LangGraph
      # interrupt/resume proof against the real AsyncPostgresSaver
      # (Phase 8's own explicit requirement: never InMemorySaver alone
      # for persistence/HITL durability tests). Same real
      # agent_runtime role/schema, no new database setup needed.
      - name: Verify real-database checkpoint durability and privilege boundary (Phase 7/8)
        working-directory: services/agent-runtime-service
        run: |
          set -a
          . ../../.env
          set +a
          AGENT_RUNTIME_REQUIRE_REAL_DB=true pytest tests/test_db_privilege_boundary.py tests/test_checkpoint_durability.py tests/test_checkpoint_pool_recovery.py tests/test_remediation_durability.py -v

      # Phase 6 correction round: a dedicated, REAL PostgreSQL
      # transaction-rollback regression -- never mocked -- proving
      # retrieval-service's atomic per-source indexing actually rolls
      # back a source's chunks (and leaves its previously-indexed rows
      # untouched) when a failure is injected mid-batch. See
      # services/retrieval-service/tests/test_db_transaction.py.
      # Deliberately placed HERE: the Phase 3A step just above already
      # ran `docker compose run --rm flyway migrate`, which picks up
      # every pending migration including
      # V5__create_retrieval_index.sql -- so by this point PostgreSQL
      # is healthy, V1-V5 are applied, and the pgvector extension and
      # reliability.retrieval_chunks both exist. Connects directly to
      # postgres's published host port (127.0.0.1:5432, this test's
      # own default) using the real POSTGRES_USER/PASSWORD/DB from
      # .env -- no retrieval-service container needs to be running for
      # this. Every row it touches is scoped under a run-unique
      # `test-atomic-*` source_key it creates and deletes itself; the
      # real corpus is never affected. RETRIEVAL_REQUIRE_REAL_DB=true
      # makes this step FAIL outright (never silently skip) if the
      # database is somehow unavailable here -- unlike the earlier
      # "Run retrieval-service tests" step above, which runs before
      # PostgreSQL even exists and is expected to skip these same
      # tests.
      - name: Verify real-database transaction rollback (Phase 6)
        working-directory: services/retrieval-service
        run: |
          set -a
          . ../../.env
          set +a
          RETRIEVAL_REQUIRE_REAL_DB=true pytest tests/test_db_transaction.py -v

      # Phase 8: a dedicated, REAL PostgreSQL proof -- never mocked --
      # of the remediation domain's own atomic/idempotent transaction
      # boundaries: idempotent proposal creation, approval atomic with
      # the incident investigating->remediating transition, rejection
      # never touching the incident, execution start/result
      # idempotency, and the failed-execution incident rollback
      # (remediating->investigating). See
      # services/control-plane/tests/test_remediation_transactions.py.
      # Placed here, alongside the Phase 6 real-database step above:
      # Flyway's own migrate step (Phase 3A, above) already applied
      # V6__create_remediation_schema.sql along with every other
      # pending migration, so reliability.remediation_proposals/
      # remediation_events already exist by this point.
      # CONTROL_PLANE_REQUIRE_REAL_DB=true makes this step FAIL
      # outright (never silently skip) if the database is somehow
      # unavailable here.
      #
      # Post-GitHub-Actions-run-#35 fix: this pytest invocation runs
      # directly on the runner HOST (never inside a container on the
      # Compose network), so it must reach PostgreSQL's HOST-PUBLISHED
      # address. tests/conftest.py intentionally poisons the GLOBAL
      # POSTGRES_HOST to "postgres.invalid" for every OTHER
      # (non-real-database) test in this suite -- a safety net this
      # step must never weaken. test_remediation_transactions.py's own
      # `session` fixture therefore reads the SEPARATE, dedicated
      # CONTROL_PLANE_TEST_POSTGRES_HOST/_PORT set explicitly below
      # instead (see that file's own module docstring); setting them
      # here makes the host-vs-Compose-network boundary explicit
      # rather than relying solely on their own already-correct
      # defaults (127.0.0.1 / $POSTGRES_PORT-or-5432).
      - name: Verify real-database remediation transactions (Phase 8)
        working-directory: services/control-plane
        run: |
          set -a
          . ../../.env
          set +a
          CONTROL_PLANE_TEST_POSTGRES_HOST=127.0.0.1 \
          CONTROL_PLANE_TEST_POSTGRES_PORT="$POSTGRES_PORT" \
          CONTROL_PLANE_REQUIRE_REAL_DB=true pytest tests/test_remediation_transactions.py -v

      # Phase 3B: brings up the control-plane container (building its
      # image if not already built — the same implicit-build-on-`up`
      # pattern already used for the four demo services below, no
      # separate `docker compose build` step), re-applies migrations
      # idempotently (safe even though Phase 3A's step above already
      # did), and proves the real FastAPI service against the real
      # PostgreSQL reliability.incidents table end to end — insert via
      # SQL, fetch via HTTP, filters, pagination, ordering, 404/422,
      # read-only (no incidental writes), and recovery after a real
      # PostgreSQL restart. Reuses the identical shared script used
      # locally (scripts/verify-control-plane.sh) — no integration
      # logic duplicated in this workflow. Deliberately placed AFTER
      # the Phase 3A persistence verifier above (which itself restarts
      # PostgreSQL) completes, and before the four demo services' own
      # health waits, since it is independent of them.
      - name: Verify control plane (Phase 3B)
        run: ./scripts/verify-control-plane.sh

      # Phase 3C/3D: focused, fast webhook-ingestion acceptance — real
      # authentication (missing/wrong Bearer token), payload validation,
      # the real atomic PostgreSQL upsert/deduplication behavior
      # (incidents_active_fingerprint_uniq), transaction all-or-nothing
      # behavior, real source-driven resolution (including idempotent
      # duplicate resolution), and a real PostgreSQL outage returning
      # 503 — all POSTed directly to control-plane's own webhook
      # endpoint (not through Alertmanager; that's what the real alert
      # lifecycle step further below proves). Reuses the identical
      # shared script used locally (scripts/verify-webhook-ingestion.sh)
      # — no integration logic duplicated in this workflow. Placed
      # immediately after Phase 3B's own verifier, and well before the
      # expensive real Collector-outage lifecycle gate at the end of
      # this job.
      - name: Verify webhook ingestion (Phase 3C/3D)
        run: ./scripts/verify-webhook-ingestion.sh

      # Phase 3D: focused real PostgreSQL incident lifecycle
      # acceptance — the full state machine via the real PATCH
      # endpoint, optimistic concurrency (including a genuine
      # concurrent-request race with exactly one winner), real
      # PostgreSQL restart durability, and real occurrence-identity/
      # stale-replay handling via the real webhook endpoint. Reuses
      # the identical shared script used locally
      # (scripts/verify-incident-lifecycle.sh) — no integration logic
      # duplicated in this workflow. Does not touch otel-collector, so
      # placement relative to the Collector-outage gate doesn't matter;
      # kept here, alongside the other focused control-plane
      # verifiers, before the four demo services' own health waits.
      - name: Verify incident lifecycle (Phase 3D)
        run: ./scripts/verify-incident-lifecycle.sh

      # Phase 3E: focused real PostgreSQL audit-trail acceptance — the
      # V3 schema itself (constraints, index, append-only triggers),
      # correct event attribution for every accepted creation/
      # observation/operator-transition/automatic-resolution, zero
      # events for every rejected/ignored/no-op operation, a real
      # transactional-rollback proof, a genuine concurrent-PATCH race
      # producing exactly one event, and audit-trail restart
      # durability. Reuses the identical shared script used locally
      # (scripts/verify-incident-audit.sh) — no integration logic
      # duplicated in this workflow. Does not touch otel-collector, so
      # placement relative to the Collector-outage gate doesn't
      # matter; kept here, alongside the other focused control-plane
      # verifiers, before the four demo services' own health waits —
      # and, critically, before the expensive final alert-lifecycle
      # gate at the end of this job.
      - name: Verify incident audit trail (Phase 3E)
        run: ./scripts/verify-incident-audit.sh

      - name: Wait for checkout-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q checkout-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "checkout-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for checkout-service
        run: |
          body="$(curl -fsS http://localhost:8080/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "checkout-service"'

          actuator="$(curl -fsS http://localhost:8080/actuator/health)"
          echo "$actuator"
          echo "$actuator" | jq -e '.status == "UP"'

      - name: Wait for payment-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q payment-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "payment-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for payment-service
        run: |
          body="$(curl -fsS http://localhost:8081/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "payment-service"'

      - name: Wait for inventory-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q inventory-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "inventory-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for inventory-service
        run: |
          body="$(curl -fsS http://localhost:8082/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "inventory-service"'

      - name: Wait for notification-service to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q notification-service)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "notification-service did not become healthy in time" >&2
          exit 1

      - name: HTTP smoke test for notification-service
        run: |
          body="$(curl -fsS http://localhost:8083/health)"
          echo "$body"
          echo "$body" | jq -e '.status == "UP" and .service == "notification-service"'

      # Tempo has a real Docker-level healthcheck (its own "-health"
      # binary mode, see docker-compose.yml), unlike otel-collector. This
      # must run before the checkout smoke test below, so the checkout
      # trace it generates isn't exported before Tempo is ready to
      # receive it.
      - name: Wait for Tempo to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q tempo)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Tempo did not become healthy in time" >&2
          exit 1

      # Alertmanager has a real Docker-level healthcheck (its pinned
      # image has both a shell and wget, see docker-compose.yml).
      - name: Wait for Alertmanager to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q alertmanager)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Alertmanager did not become healthy in time" >&2
          exit 1

      # Loki's official image has no shell/curl/wget and no -health-style
      # CLI flag, so (like otel-collector) it has no Docker-level
      # healthcheck. Checked here, before the checkout smoke test below,
      # so Alloy has a ready Loki to ship the test app's logs to.
      - name: Wait for Loki to become ready
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if curl -fsS http://localhost:3100/ready >/dev/null 2>&1; then
              exit 0
            fi
            echo "Attempt $i/$attempts: Loki /ready not ready yet"
            sleep 3
          done
          echo "Loki /ready (localhost:3100) never responded" >&2
          exit 1

      # Alloy has a shell but no curl/wget, so likewise no Docker-level
      # healthcheck; verified via its own debug API instead, requiring
      # all 4 pipeline components (discovery.docker, discovery.relabel,
      # loki.source.docker, loki.write) to report healthy.
      - name: Wait for Alloy to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if body="$(curl -fsS http://localhost:12345/api/v0/web/components)" && echo "$body" | jq -e '
                (length >= 4) and (all(.[]; .health.state == "healthy"))
              ' >/dev/null 2>&1
            then
              echo "$body"
              exit 0
            fi
            echo "Attempt $i/$attempts: Alloy components not all healthy yet"
            sleep 3
          done
          echo "Alloy components (localhost:12345/api/v0/web/components) never all reported healthy" >&2
          exit 1

      - name: End-to-end checkout orchestration smoke test
        run: |
          body="$(curl -fsS -X POST http://localhost:8080/checkouts \
            -H 'Content-Type: application/json' \
            -d '{"sku":"sku_keyboard_001","quantity":2,"amount_cents":2599,"currency":"USD","recipient":"customer@example.com"}')"
          echo "$body"
          echo "$body" | jq -e '
            (.checkout_id | type == "string" and startswith("chk_"))
            and .status == "COMPLETED"
            and (.payment.payment_id | type == "string" and length > 0)
            and .payment.status == "AUTHORIZED"
            and (.inventory.reservation_id | type == "string" and length > 0)
            and .inventory.status == "RESERVED"
            and (.notification.notification_id | type == "string" and length > 0)
            and .notification.status == "ACCEPTED"
          '

      - name: Wait for Prometheus to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q prometheus)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Prometheus did not become healthy in time" >&2
          exit 1

      - name: Wait for Grafana to become healthy
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            cid="$(docker compose ps -q grafana)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            echo "Attempt $i/$attempts: health=$health"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Grafana did not become healthy in time" >&2
          exit 1

      # otel-collector's official image has no shell/wget/curl, so it has
      # no Docker-level healthcheck (see docker-compose.yml comment). Its
      # liveness is instead proven here: Prometheus can only report this
      # scrape target "up" if it actually reached the Collector over the
      # Compose network and got a valid response.
      - name: Verify Prometheus reports itself and the Collector as UP
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if body="$(curl -fsS http://localhost:9090/api/v1/targets)" && echo "$body" | jq -e '
                ([.data.activeTargets[] | select(.labels.job=="prometheus") | .health] | length > 0 and all(.[]; . == "up"))
                and
                ([.data.activeTargets[] | select(.labels.job=="otel-collector") | .health] | length > 0 and all(.[]; . == "up"))
                and
                ([.data.activeTargets[] | select(.labels.job=="otel-collector-app-metrics") | .health] | length > 0 and all(.[]; . == "up"))
              ' >/dev/null 2>&1
            then
              echo "$body"
              exit 0
            fi
            echo "Attempt $i/$attempts: prometheus/otel-collector/otel-collector-app-metrics targets not all UP yet"
            sleep 3
          done
          echo "Prometheus targets (prometheus, otel-collector, otel-collector-app-metrics) never all reported UP" >&2
          curl -fsS http://localhost:9090/api/v1/targets || true
          exit 1

      - name: Verify Grafana health and provisioned Prometheus + Tempo + Loki datasources
        run: |
          set -a
          . ./.env
          set +a

          health="$(curl -fsS http://localhost:3000/api/health)"
          echo "$health"
          echo "$health" | jq -e '.database == "ok"'

          datasources="$(curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" http://localhost:3000/api/datasources)"
          echo "$datasources"
          echo "$datasources" | jq -e '[.[] | select(.type == "prometheus" and .url == "http://prometheus:9090")] | length > 0'
          echo "$datasources" | jq -e '[.[] | select(.type == "tempo" and .url == "http://tempo:3200")] | length > 0'
          echo "$datasources" | jq -e '[.[] | select(.type == "loki" and .url == "http://loki:3100")] | length > 0'

      # The OTel Java agent's/Python SDK's/Go SDK's/Node SDK's metric
      # export interval and Prometheus's own scrape cycle are both
      # asynchronous, so this is retried rather than checked once
      # immediately after the smoke test above. Phase 2A.5 extends this
      # with notification-service's HTTP server metrics (the other three
      # services' checks are unchanged).
      - name: Verify all four application services' metrics reach Prometheus
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if server_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="checkout-service",http_route="/checkouts"}')" \
                && echo "$server_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1 \
                && client_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=count by (server_address) (http_client_request_duration_seconds_count{service_name="checkout-service"})')" \
                && echo "$client_body" | jq -e '
                    ([.data.result[].metric.server_address] | unique | sort) ==
                    ["inventory-service", "notification-service", "payment-service"]
                  ' >/dev/null 2>&1 \
                && payment_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="payment-service",http_route="/payments/authorize"}')" \
                && echo "$payment_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1 \
                && inventory_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="inventory-service",http_route="/inventory/reservations"}')" \
                && echo "$inventory_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1 \
                && notification_body="$(curl -fsS -G 'http://localhost:9090/api/v1/query' \
                  --data-urlencode 'query=http_server_request_duration_seconds_count{service_name="notification-service",http_route="/notifications"}')" \
                && echo "$notification_body" | jq -e '.data.result | length > 0' >/dev/null 2>&1
            then
              echo "$server_body"
              echo "$client_body"
              echo "$payment_body"
              echo "$inventory_body"
              echo "$notification_body"
              exit 0
            fi
            echo "Attempt $i/$attempts: application service HTTP metrics not all in Prometheus yet"
            sleep 3
          done
          echo "one or more application services' metrics never appeared in Prometheus" >&2
          exit 1

      # There is no trace backend yet; traces are verified via the
      # Collector's debug exporter output in its own container logs.
      # Retried because the batch/span export delay is async for the
      # Java agent, the Python SDK, the Go SDK, and the Node SDK alike.
      # Phase 2A.5 extends the same generalized parser
      # (scripts/parse-checkout-trace.py) to require all three downstream
      # branches (payment, inventory, notification) — a COMPLETE
      # distributed trace across the whole checkout workflow, not just
      # that all four service names appear somewhere in the logs.
      - name: Verify checkout-service trace evidence and complete checkout distributed trace
        id: checkout-trace
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if logs="$(docker compose logs otel-collector 2>&1)" \
                && grep -qF 'service.name: Str(checkout-service)' <<<"$logs" \
                && grep -qF 'Name           : POST /checkouts' <<<"$logs" \
                && grep -qF 'Kind           : Server' <<<"$logs" \
                && grep -qF 'Kind           : Client' <<<"$logs" \
                && grep -qF 'url.full: Str(http://payment-service:8081/payments/authorize)' <<<"$logs" \
                && grep -qF 'url.full: Str(http://inventory-service:8082/inventory/reservations)' <<<"$logs" \
                && grep -qF 'url.full: Str(http://notification-service:8083/notifications)' <<<"$logs" \
                && checkout_trace_match="$(docker compose logs --no-log-prefix otel-collector | python3 scripts/parse-checkout-trace.py)"
            then
              echo "$checkout_trace_match"
              echo "match=$checkout_trace_match" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/$attempts: checkout trace evidence and/or complete checkout distributed trace correlation (payment + inventory + notification branches) not found yet"
            sleep 3
          done
          echo "checkout-service trace evidence and/or complete checkout distributed trace correlation never appeared in Collector logs" >&2
          exit 1

      # Phase 2B.1: independently re-verifies the exact same Trace ID and
      # seven Span IDs from the step above directly against Tempo's own
      # HTTP query API (GET /api/v2/traces/{traceID}), not just that the
      # Collector attempted to export them. Retried because Collector ->
      # Tempo export and Tempo's own ingest-to-query path are both async.
      - name: Verify checkout trace retrieval and validation from Tempo
        run: |
          match='${{ steps.checkout-trace.outputs.match }}'
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if tempo_match="$(python3 scripts/verify-tempo-trace.py --tempo-url http://localhost:3200 "$match")"; then
              echo "$tempo_match"
              exit 0
            fi
            echo "Attempt $i/$attempts: checkout trace not yet retrievable/valid from Tempo"
            sleep 3
          done
          echo "Tempo never served the real checkout trace with all seven spans and correct parent/child relationships" >&2
          exit 1

      # Phase 2B.2: proves genuine, non-synthetic log output from all
      # four application services was actually collected through the
      # Alloy -> Loki pipeline (Docker log discovery/shipping and Loki
      # indexing are both asynchronous, so this is retried). Reuses the
      # same validator (scripts/verify-loki-logs.py) as the local
      # verifier, so there is no duplicated validation logic between
      # local and CI. --after-ns requires evidence newer than the
      # run-start timestamp captured above (CI runners are ephemeral, so
      # this is mostly a consistency/defense-in-depth match with the
      # local verifier rather than addressing an observed CI failure).
      # The more expensive Loki restart-persistence test remains
      # local-only (scripts/verify-observability.sh); this step
      # independently proves all four services' logs are queryable.
      - name: Verify real application logs reach Loki
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if python3 scripts/verify-loki-logs.py --loki-url http://localhost:3100 --since-seconds 1800 --after-ns "${{ steps.run-start.outputs.ns }}"; then
              exit 0
            fi
            echo "Attempt $i/$attempts: real logs for all four services not yet queryable from Loki"
            sleep 3
          done
          echo "scripts/verify-loki-logs.py never confirmed real, nonempty logs from all four application services in Loki" >&2
          exit 1

      # Phase 2B.3: verifies the three auto-provisioned Grafana
      # dashboards through Grafana's real API (correct panels,
      # datasource references, template variables) and independently
      # re-executes every panel's own PromQL/LogQL query directly
      # against Prometheus and Loki. Reuses the same validator
      # (scripts/verify-grafana-dashboards.py) as the local verifier —
      # no duplicated validation logic. Runs after real checkout
      # traffic and log ingestion above, since several panels require
      # that data to already exist.
      - name: Verify Grafana dashboards
        run: |
          set -a
          . ./.env
          set +a

          attempts=20
          for i in $(seq 1 "$attempts"); do
            if python3 scripts/verify-grafana-dashboards.py \
                 --grafana-url http://localhost:3000 \
                 --user "$GRAFANA_ADMIN_USER" --password "$GRAFANA_ADMIN_PASSWORD" \
                 --prometheus-url http://localhost:9090 \
                 --loki-url http://localhost:3100
            then
              exit 0
            fi
            echo "Attempt $i/$attempts: Grafana dashboards not yet fully verifiable"
            sleep 3
          done
          echo "scripts/verify-grafana-dashboards.py never confirmed all three provisioned dashboards" >&2
          exit 1

      # Phase 2B.4: confirms Alertmanager itself is healthy and that
      # Prometheus actually loaded all four expected alert rules
      # (correct expressions, for: durations, labels, annotations),
      # each starting "inactive". Reuses scripts/verify-alerting.py —
      # no duplicated validation logic.
      - name: Verify Alertmanager health and alert rules loaded
        run: |
          attempts=20
          for i in $(seq 1 "$attempts"); do
            if python3 scripts/verify-alerting.py health --alertmanager-url http://localhost:9093 \
                 && python3 scripts/verify-alerting.py rules --prometheus-url http://localhost:9090
            then
              exit 0
            fi
            echo "Attempt $i/$attempts: Alertmanager health / Prometheus rule-loading not yet fully verifiable"
            sleep 3
          done
          echo "scripts/verify-alerting.py never confirmed Alertmanager health and all four expected alert rules loaded/inactive" >&2
          exit 1

      # Phase 2B.4 + Phase 3C: the alert lifecycle acceptance test —
      # proves a real Prometheus rule (TelemetryPipelineUnavailable)
      # goes inactive -> pending -> firing because of a genuine,
      # controlled failure (stopping otel-collector, never a rule-file
      # edit or a direct POST to Alertmanager's API), that the same
      # firing alert is independently observable through Alertmanager's
      # own API, and that both recover once otel-collector is
      # restarted. VERIFY_INGESTION=true additionally proves — using
      # this SAME real outage, not a second one — that Alertmanager's
      # real webhook delivery persisted the firing alert as a genuine,
      # correctly-mapped reliability.incidents row (see
      # scripts/verify-ingestion.py), AND (Phase 3D) that once the
      # Collector recovers and Alertmanager resolves, its real resolved
      # webhook delivery actually transitions that exact incident to
      # status=resolved with resolved_at populated, AND (Phase 3E) that
      # this exact real chain produced a genuine, correctly-attributed
      # audit trail (a 'created' event and a resolving
      # 'status_transition' event, both actor_type='alertmanager', no
      # fabricated operator intervention). Reuses the identical shared
      # script used locally (scripts/verify-alert-lifecycle.sh, which
      # itself reuses scripts/verify-alerting.py for all Prometheus/
      # Alertmanager HTTP API validation) — no lifecycle, ingestion,
      # resolution, or audit logic duplicated in this workflow. That
      # script restores otel-collector via its own EXIT trap if it
      # fails partway through, so a failure here never leaves the
      # Collector stopped. Runs after every other telemetry/dashboard
      # step above (and after the focused Phase 3C/3D/3E webhook-
      # ingestion, incident-lifecycle, and incident-audit steps above),
      # since stopping otel-collector would otherwise invalidate them.
      - name: Run alert lifecycle + ingestion + resolution + audit acceptance test
        run: VERIFY_INGESTION=true bash scripts/verify-alert-lifecycle.sh

      # Phase 5 correction round: a timestamp checkpoint captured
      # IMMEDIATELY BEFORE the Phase 4 step below, exported to every
      # later step via $GITHUB_ENV. The Phase 5 step further down
      # requires the incident it reuses to have a first_seen_at AFTER
      # this checkpoint -- proving it was genuinely produced by THIS
      # job's own Phase 4 run, not a stale incident from an earlier one.
      - name: Capture Phase 5 freshness checkpoint
        run: echo "PHASE5_FRESHNESS_CHECKPOINT=$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())')" >> "$GITHUB_ENV"

      # Phase 4: real controlled failure injection against payment-service
      # and inventory-service (never postgres, never otel-collector).
      # Deliberately placed AFTER the Collector-outage gate above, so
      # this phase's own real outages cannot interfere with that gate's
      # preconditions. payment-outage's --full-acceptance proves the
      # real Prometheus CheckoutServerErrors -> Alertmanager webhook ->
      # incident -> audit -> recovery chain (its own, separate alert
      # rule and real failure mechanism — no second Collector outage);
      # inventory-outage runs its own deterministic checks only. See
      # scripts/verify-failure-simulation.sh and
      # docs/architecture/phase-4-failure-simulation.md.
      # timeout-minutes bumped 15 -> 30: this step now also includes a
      # bounded (90 attempts x 5s = up to 7.5 real minutes), condition-
      # based wait for the shared CheckoutServerErrors alert to settle
      # back to a clean inactive state after inventory-outage's own
      # real checkout failure, on top of payment-outage's existing
      # real fire/recover cycle -- see
      # scripts/verify-failure-simulation.sh's own "3. Confirm shared
      # CheckoutServerErrors state is clean after inventory-outage"
      # section. This is a step-local ceiling only; the overall job
      # timeout-minutes above is untouched.
      - name: Verify failure simulation (Phase 4)
        timeout-minutes: 30
        run: bash scripts/verify-failure-simulation.sh

      # Phase 5: the read-only AI investigator's real-evidence
      # acceptance gate. Deliberately placed AFTER the Phase 4 gate
      # above so it can reuse the real, already-persisted, resolved
      # CheckoutServerErrors incident that run just produced, rather
      # than causing another real outage. PHASE5_FRESHNESS_CHECKPOINT
      # (captured above, before Phase 4 even ran) makes this a
      # freshness-PROVEN reuse, not merely an assumed one. Forces
      # INVESTIGATOR_LLM_PROVIDER=stub for this run only (captured
      # original mode restored and verified afterward) so this
      # exercises the real control-plane/Prometheus/Loki/Tempo evidence
      # pipeline end-to-end without a real, paid LLM API key -- no
      # credentials are configured or required in CI. See
      # scripts/verify-investigator.sh and
      # docs/architecture/phase-5-ai-investigator.md.
      - name: Verify investigator (Phase 5)
        timeout-minutes: 5
        run: bash scripts/verify-investigator.sh

      # Phase 6: the RAG retrieval acceptance gate. Deliberately placed
      # AFTER both the Phase 4 and Phase 5 gates above, reusing the
      # exact same real, already-persisted, resolved
      # CheckoutServerErrors incident (and the SAME
      # PHASE5_FRESHNESS_CHECKPOINT captured once, before Phase 4) --
      # no new outage, no new checkpoint mechanism. Sources
      # scripts/verify-investigator.sh for its reusable helpers rather
      # than duplicating them. Uses only the deterministic local
      # embedding provider (default) and the deterministic stub LLM
      # provider (forced temporarily, restored and verified
      # afterward, same as Phase 5) -- no credentials configured or
      # required in CI. See scripts/verify-rag.sh and
      # docs/architecture/phase-6-rag-retrieval.md.
      - name: Verify RAG retrieval (Phase 6)
        timeout-minutes: 10
        run: bash scripts/verify-rag.sh

      # Phase 7: the durable LangGraph agent-runtime acceptance gate.
      # Deliberately placed AFTER the Phase 6 gate above, reusing the
      # exact same real, already-persisted, resolved
      # CheckoutServerErrors incident (and the SAME
      # PHASE5_FRESHNESS_CHECKPOINT captured once, before Phase 4) --
      # no new outage, no new checkpoint mechanism. Sources
      # scripts/verify-rag.sh (which itself sources
      # scripts/verify-investigator.sh) for its reusable helpers rather
      # than duplicating them. Uses the same deterministic stub LLM
      # provider machinery as Phase 5/6 (forced temporarily, restored
      # and verified afterward) -- no credentials configured or
      # required in CI. See scripts/verify-agent-runtime.sh and
      # docs/architecture/phase-7-durable-agent-runtime.md.
      - name: Verify agent runtime (Phase 7)
        timeout-minutes: 10
        run: bash scripts/verify-agent-runtime.sh

      # Phase 8: human-approved remediation acceptance. Deliberately
      # placed AFTER the Phase 7 gate above, but creates its OWN FRESH
      # incident (never reuses Phase 4's already-resolved one -- Phase
      # 8 is a MUTATING demo and must prove its own real chain: a real
      # checkout failure induced by the controlled payment
      # authorization fault, a real Prometheus/Alertmanager alert, a
      # real human-approved remediation proposal, real tool-gateway
      # execution, real recovery, and the SAME incident naturally
      # resolving via Alertmanager's own real webhook). Sources
      # scripts/verify-agent-runtime.sh (which itself sources
      # scripts/verify-rag.sh -> scripts/verify-investigator.sh) and
      # scripts/simulate-failure.sh for their reusable helpers rather
      # than duplicating them. Uses the same deterministic stub LLM
      # provider machinery as Phase 5/6/7 -- no credentials configured
      # or required in CI. See scripts/verify-remediation.sh and
      # docs/architecture/phase-8-human-approval-remediation.md.
      - name: Verify remediation (Phase 8)
        timeout-minutes: 20
        run: bash scripts/verify-remediation.sh

      # Phase 9 completion pass: the operator web console's own real
      # end-to-end acceptance -- a single Playwright-driven browser
      # session performs the ENTIRE human workflow (open the incident,
      # Start AI Investigation, Run investigation to the real
      # waiting_for_approval interrupt, Approve, a separate "Continue
      # workflow" click that actually resumes execution, real
      # tool-gateway remediation, and the same incident naturally
      # resolving via Alertmanager's own webhook) against the real
      # running stack, never a mocked backend. Deliberately placed
      # AFTER the Phase 8 gate above: it creates its OWN FRESH incident
      # via the same controlled payment-authorization fault mechanism
      # (never reusing Phase 8's own already-resolved one), so ordering
      # relative to Phase 8 doesn't matter for correctness, but running
      # after it means every other backend service this test also
      # depends on (control-plane, agent-runtime-service,
      # investigator-service, tool-gateway, payment-service,
      # checkout-service) is already confirmed healthy and exercised at
      # least once. Sources scripts/verify-investigator.sh for its
      # reusable provider-mode-restore helpers rather than duplicating
      # them, and reuses the SAME deterministic stub LLM provider
      # machinery as Phase 5/6/7/8 -- no credentials configured or
      # required in CI beyond the lifecycle/approver/fault tokens the
      # earlier Phase 3C/3D/8 secret-init steps already generated. Also
      # starts (or confirms) the web-console container itself, since no
      # earlier step in this job does. See scripts/verify-web-console.sh
      # and docs/architecture/phase-9-web-console.md.
      - name: Verify web console (Phase 9)
        timeout-minutes: 25
        run: bash scripts/verify-web-console.sh

      # CI cross-phase stabilization audit, Part E: a NON-MUTATING,
      # read-only diagnostic dump of recent incident/audit state --
      # never affects pass/fail on its own. Gives immediate forensic
      # evidence (which incident_id/event_type/actor_type/timestamp
      # combination actually changed) if anything in Phases 4-8 still
      # fails, instead of another blind, unexplained CI failure. Only
      # runs on an actual failure (if: failure()), so it adds no cost
      # to a normal green run.
      - name: Dump recent incident/audit state on failure
        if: failure()
        run: |
          # Post-commit fix (GitHub Actions run #39976783998): this
          # step previously sourced ./.env UNCONDITIONALLY, so a
          # failure occurring BEFORE the "Create runtime .env from
          # .env.example" step further up this job (e.g. the
          # web-console build failure this exact run hit) produced a
          # SECOND, unrelated, confusing failure here (". ./.env: No
          # such file or directory") on top of the real one -- never
          # itself prints .env's contents either way, only sources it
          # into this step's own shell variables.
          if [ ! -f ./.env ]; then
            echo "runtime .env has not been created yet -- the failure occurred before this job's own Compose/runtime initialization steps ran. Skipping incident/audit diagnostics (there is no database to query yet)."
            exit 0
          fi
          set -a
          . ./.env
          set +a
          if [ -z "$(docker compose ps -q postgres 2>/dev/null)" ]; then
            echo "postgres is not running yet -- the failure occurred before this job's own 'Start Compose environment' step. Skipping incident/audit diagnostics."
            exit 0
          fi
          echo "--- reliability.incidents (most recent 20, by created_at desc) ---"
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
            SELECT id, source_fingerprint, title, status, first_seen_at, last_seen_at, resolved_at
            FROM reliability.incidents
            ORDER BY created_at DESC
            LIMIT 20;
          " || true
          echo "--- reliability.incident_events (most recent 40, by occurred_at desc) ---"
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
            SELECT id, incident_id, event_type, actor_type, previous_status, new_status, occurred_at
            FROM reliability.incident_events
            ORDER BY occurred_at DESC
            LIMIT 40;
          " || true

      - name: Show service logs
        if: always()
        run: |
          docker compose logs --tail=100 postgres
          docker compose logs --tail=100 control-plane
          docker compose logs --tail=100 checkout-service
          docker compose logs --tail=100 investigator-service
          docker compose logs --tail=100 retrieval-service
          docker compose logs --tail=100 agent-runtime-service
          docker compose logs --tail=100 tool-gateway
          docker compose logs --tail=100 payment-service
          docker compose logs --tail=100 inventory-service
          docker compose logs --tail=100 notification-service
          docker compose logs --tail=100 otel-collector
          docker compose logs --tail=100 prometheus
          docker compose logs --tail=100 grafana
          docker compose logs --tail=100 tempo
          docker compose logs --tail=100 loki
          docker compose logs --tail=100 alloy
          docker compose logs --tail=100 alertmanager
          docker compose logs --tail=100 web-console

      - name: Stop Compose environment (preserve volumes)
        if: always()
        run: docker compose down

  # Phase 17A: deployment-hardening acceptance. A SEPARATE job from
  # `repository-validation` above (which is completely unchanged by
  # this addition) -- its own disposable Compose project
  # (COMPOSE_PROJECT_NAME=arp-deploy-ci), its own fresh volumes, and
  # its own teardown (--volumes), never touching anything the other
  # job's `docker compose` (default project) might also be using on
  # the same runner. Real runtime evidence throughout -- no step here
  # substitutes a static YAML read for an actual, running proof.
  phase-17a-deployment-validation:
    name: Phase 17A deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: arp-deploy-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Confirm Docker Compose supports the !override merge tag (>= v2.24.4)
        run: |
          docker compose version
          cat > /tmp/base-override-probe.yml <<'EOF'
          services:
            probe:
              image: busybox
              ports: ["127.0.0.1:18080:80"]
          EOF
          cat > /tmp/override-override-probe.yml <<'EOF'
          services:
            probe:
              ports: !override []
          EOF
          result="$(docker compose -f /tmp/base-override-probe.yml -f /tmp/override-override-probe.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["probe"].get("ports"))')"
          [ "$result" = "None" ] || { echo "FAIL: !override did not fully replace the ports list on this Compose version -- got: $result"; exit 1; }
          echo "PASS: !override correctly replaces (not concatenates) a list field on this runner's Docker Compose version."

      - name: Check Phase 17A shell script syntax
        run: |
          for f in deploy/scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Generate CI-disposable deployment secrets
        run: |
          cp deploy/.env.deploy.example deploy/.env.deploy
          # CORRECTION ROUND (second pass) -- real finding: SMTP_PORT
          # was never overridden here, so it kept the example file's
          # own default (587, a real SMTP relay's STARTTLS port).
          # mailpit (deploy/docker-compose.test-smtp.yml) only ever
          # listens on 1025 -- without this, web-console's real SMTP
          # client gets `connect ECONNREFUSED ...:587` on every send
          # attempt, so the "Real email verification/invitation/
          # password-reset proof" step below could never have
          # actually delivered a real email through mailpit at all.
          sed -i \
            -e 's#^DEPLOYMENT_PUBLIC_ORIGIN=.*#DEPLOYMENT_PUBLIC_ORIGIN=https://arp-deploy-ci.test#' \
            -e 's#^SMTP_HOST=.*#SMTP_HOST=mailpit#' \
            -e 's#^SMTP_FROM_ADDRESS=.*#SMTP_FROM_ADDRESS=noreply@arp-deploy-ci.test#' \
            -e 's#^SMTP_SECURITY=.*#SMTP_SECURITY=none#' \
            -e 's#^SMTP_PORT=.*#SMTP_PORT=1025#' \
            deploy/.env.deploy
          echo "ALLOW_INSECURE_SMTP_FOR_LOCAL_PROOF=true" >> deploy/.env.deploy

      - name: Preflight MUST fail before secrets are generated (placeholder detection)
        run: |
          cp deploy/.env.deploy deploy/.env.deploy.realsecrets.bak
          cp deploy/.env.deploy.example deploy/.env.deploy
          sed -i \
            -e 's#^DEPLOYMENT_PUBLIC_ORIGIN=.*#DEPLOYMENT_PUBLIC_ORIGIN=https://arp-deploy-ci.test#' \
            deploy/.env.deploy
          if ./deploy/scripts/preflight.sh; then
            echo "FAIL: preflight passed against placeholder/empty secrets -- it must fail closed"
            exit 1
          fi
          echo "PASS: preflight correctly rejected placeholder/missing secrets"
          mv deploy/.env.deploy.realsecrets.bak deploy/.env.deploy

      - name: Generate real deployment secrets and runtime DB roles SQL
        run: ./deploy/scripts/init-deploy-secrets.sh

      - name: Preflight MUST pass once real secrets are generated
        run: ./deploy/scripts/preflight.sh

      - name: Preflight fault-injection regression suite (malformed config, failed commands, invalid origins, insecure settings)
        # CORRECTION ROUND (second pass): wires deploy/scripts/
        # test-preflight-regressions.sh's 13 real fault-injection
        # cases into CI itself -- previously only ever run manually.
        # Safe to run here: it builds and restores its own disposable
        # deploy/.env.deploy and deploy/secrets/ fixtures internally
        # (never assumes either already exists), restoring the REAL
        # secrets this job just generated above before this step
        # exits, so every later step continues against them unchanged.
        run: ./deploy/scripts/test-preflight-regressions.sh

      - name: Restore.sh fault-injection regression suite (client-launch failure, connection failure, abnormal termination)
        run: ./deploy/scripts/test-restore-regressions.sh

      - name: Real auth.member grant-boundary proof, including the historical-default-privilege upgrade fixture (disposable, isolated infra)
        run: ./deploy/scripts/test-auth-grant-boundary.sh

      - name: Real Caddy log-redaction proof with the exact pinned image (verification-query, reset-path, and reset-landing-query tokens)
        # CORRECTION ROUND (third pass): runs the EXACT, unmodified
        # deploy/caddy/Caddyfile with the pinned caddy:2.10.2-alpine
        # image against a disposable fake backend reproducing all
        # three real Better Auth token-leak shapes -- proves the
        # fields-map-key-collision fix (one combined regexp instead
        # of two competing declarations for the same "request>uri"
        # key) actually holds. Fully self-contained; does not touch
        # this job's own running deployment stack.
        run: ./deploy/scripts/test-caddy-redaction-proof.sh

      - name: Email-flows log-scan fault-injection regressions (failed fetch, missing tokens, irrelevant log capture)
        # CORRECTION ROUND (third pass): the exact independently
        # reported bug -- `|| true` on the Caddy log fetch inside
        # deploy/scripts/test-email-flows.sh meant a failed fetch (or
        # an empty/irrelevant capture) could produce a false PASS.
        # Fakes docker/python3 on PATH; never touches a real stack.
        run: ./deploy/scripts/test-email-flows-log-scan-regressions.sh

      - name: Confirm the fully merged deployment configuration publishes a port ONLY for caddy
        run: |
          set -a; source deploy/.env.deploy; set +a
          offenders="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml config --format json \
            | python3 -c 'import json,sys; cfg=json.load(sys.stdin); print(",".join(n for n,s in cfg["services"].items() if s.get("ports") and n!="caddy"))')"
          [ -z "$offenders" ] || { echo "FAIL: non-proxy services publish a port: $offenders"; exit 1; }
          echo "PASS: only caddy publishes a port in the merged configuration"

      - name: Bring up the deployment stack
        run: ./deploy/scripts/deploy-up.sh

      - name: Extract Caddy's local CA root certificate for explicit client trust
        run: |
          set -a; source deploy/.env.deploy; set +a
          for _ in $(seq 1 30); do
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
              -f docker-compose.yml -f deploy/docker-compose.override.yml \
              cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/caddy_root.crt 2>/dev/null && break
            sleep 2
          done
          test -s /tmp/caddy_root.crt

      - name: Real HTTPS proof -- explicit CA trust, no -k, no global TLS bypass
        run: |
          set -a; source deploy/.env.deploy; set +a
          code="$(curl -s -o /dev/null -w '%{http_code}' --resolve arp-deploy-ci.test:443:127.0.0.1 --cacert /tmp/caddy_root.crt "$DEPLOYMENT_PUBLIC_ORIGIN/")"
          [ "$code" != "000" ] || { echo "FAIL: HTTPS request failed outright (TLS handshake or connection failure)"; exit 1; }
          echo "PASS: real TLS handshake succeeded against Caddy's own local CA (HTTP $code)"

      - name: Trailing-slash and unexpected-method behavior for the telemetry ingestion route
        run: |
          set -a; source deploy/.env.deploy; set +a
          CURL="curl -s -o /dev/null -w %{http_code} --resolve arp-deploy-ci.test:443:127.0.0.1 --cacert /tmp/caddy_root.crt"
          trailing="$($CURL -X POST "$DEPLOYMENT_PUBLIC_ORIGIN/api/v1/telemetry/otlp/v1/metrics/" -d '{}')"
          wrong_method="$($CURL -X GET "$DEPLOYMENT_PUBLIC_ORIGIN/api/v1/telemetry/otlp/v1/metrics")"
          echo "trailing-slash status: $trailing ; wrong-method status: $wrong_method"
          # CORRECTION ROUND (second pass): "!= 200" alone is also
          # satisfied by a 500 crash, which is not evidence either
          # request was correctly routed away from the ingestion
          # contract -- a crashed backend proves nothing about
          # routing. Measured for real against a live deployment: the
          # trailing slash falls through to web-console, which 308s
          # (its own Next.js trailing-slash normalization) to the
          # no-slash path, itself unmatched; GET on the exact path
          # also falls through and 404s. Both must be a real
          # client-or-redirect response (2xx/3xx/4xx), never a 5xx and
          # never literally 200 (which would mean it reached and was
          # accepted by the ingestion contract).
          for pair in "trailing:$trailing" "wrong_method:$wrong_method"; do
            name="${pair%%:*}"; status="${pair#*:}"
            if [ "$status" = "000" ]; then
              echo "FAIL: $name got no response at all (connection/TLS failure) -- not valid proof of correct routing"; exit 1
            fi
            if [ "$status" -ge 500 ]; then
              echo "FAIL: $name got a server error (HTTP $status) -- not valid proof of correct routing"; exit 1
            fi
            if [ "$status" = "200" ]; then
              echo "FAIL: $name was accepted (HTTP 200) as if it were the exact ingestion path"; exit 1
            fi
          done
          echo "PASS: neither a trailing slash nor an unexpected method reaches control-plane's ingestion contract unexpectedly"

      - name: Legacy/internal routes are unreachable through the public proxy
        run: |
          set -a; source deploy/.env.deploy; set +a
          CURL="curl -s -o /dev/null -w %{http_code} --resolve arp-deploy-ci.test:443:127.0.0.1 --cacert /tmp/caddy_root.crt"
          # CORRECTION ROUND: this previously probed
          # "/api/v1/alertmanager/webhook" -- NOT the real route
          # (services/control-plane/src/control_plane/api/webhook.py
          # registers it at "/internal/v1/alertmanager/webhook").
          # Probing a path that never existed proved nothing about
          # whether the REAL internal route is exposed through the
          # public proxy. Also: the "incidents" result was previously
          # only echoed, never asserted at all -- any status
          # whatsoever would have let this step pass.
          webhook="$($CURL -X POST "$DEPLOYMENT_PUBLIC_ORIGIN/internal/v1/alertmanager/webhook")"
          incidents="$($CURL "$DEPLOYMENT_PUBLIC_ORIGIN/api/v1/incidents")"
          echo "alertmanager webhook via proxy: $webhook ; direct incidents GET via proxy: $incidents"
          # CORRECTION ROUND (second pass): "!= 200" alone is also
          # satisfied by a 500, which proves nothing about whether
          # the route is actually unreachable -- a crashed web-console
          # would also return non-200 for a request that was, in
          # fact, never routed anywhere near control-plane's real
          # internal surface. Measured for real against a live
          # deployment: both fall through to web-console's own
          # routing and 404 (no matching route there either) --
          # assert that exact value, not merely "not 200".
          [ "$webhook" = "404" ] || { echo "FAIL: expected HTTP 404 (falls through to web-console, no matching route) for the internal Alertmanager webhook via the public proxy, got $webhook"; exit 1; }
          [ "$incidents" = "404" ] || { echo "FAIL: expected HTTP 404 (falls through to web-console, no matching route) for the internal incidents list endpoint via the public proxy, got $incidents"; exit 1; }
          echo "PASS: the legacy/internal control-plane surface is not exposed through the public proxy (both fall through to web-console's own routing, never control-plane directly)"

      - name: Spoofed X-Forwarded-For does not bypass the trusted-proxy rate-limit boundary
        run: |
          set -a; source deploy/.env.deploy; set +a
          CURL="curl -s -o /dev/null -w %{http_code} --resolve arp-deploy-ci.test:443:127.0.0.1 --cacert /tmp/caddy_root.crt"
          # Caddy itself overwrites X-Forwarded-For -- a client-supplied
          # value here must never reach control-plane unmodified. Fire
          # enough invalid-credential requests, each claiming a
          # DIFFERENT spoofed source IP, to exceed the real 10-failures/
          # 5-minute auth-failure budget; if the spoofed header were
          # honored end-to-end this would never trip (each request
          # would look like it came from a fresh address).
          tripped=0
          for i in $(seq 1 15); do
            code="$($CURL -X POST "$DEPLOYMENT_PUBLIC_ORIGIN/api/v1/telemetry/otlp/v1/metrics" \
              -H "Authorization: Bearer cred_fakeidfortest$i.fakesecretvaluefortest$i" \
              -H "X-Forwarded-For: 203.0.113.$i" \
              -H "Content-Type: application/json" -d '{"resourceMetrics":[]}')"
            [ "$code" = "429" ] && tripped=1
          done
          [ "$tripped" = "1" ] || { echo "FAIL: 15 requests with 15 different spoofed X-Forwarded-For values never tripped the auth-failure limiter -- the forged header may be bypassing the trusted-proxy boundary"; exit 1; }
          echo "PASS: a spoofed, per-request-different X-Forwarded-For could not reset the auth-failure budget -- Caddy's own overwrite of this header is the only value control-plane ever sees"

      - name: Negative origin test -- an untrusted Origin is rejected by the BFF
        run: |
          set -a; source deploy/.env.deploy; set +a
          code="$(curl -s -o /dev/null -w '%{http_code}' --resolve arp-deploy-ci.test:443:127.0.0.1 --cacert /tmp/caddy_root.crt \
            -X POST "$DEPLOYMENT_PUBLIC_ORIGIN/api/services" -H "Origin: https://evil.example" -H "Content-Type: application/json" -d '{}')"
          echo "mutation request with an untrusted Origin: HTTP $code"
          # CORRECTION ROUND (second pass): "!= 200" alone is also
          # satisfied by a 500, which is not valid proof the Origin
          # guard itself did the rejecting. Measured for real against
          # a live deployment: web-console's own origin-guard
          # middleware (lib/server/origin-guard.ts) rejects with a
          # real 403 -- assert that exact value.
          [ "$code" = "403" ] || { echo "FAIL: expected HTTP 403 (web-console's own origin-guard rejection) for a mutation request with an untrusted Origin, got $code"; exit 1; }
          echo "PASS: an untrusted Origin was rejected with the real origin-guard's own 403"

      - name: Real email verification/invitation/password-reset proof (disposable, non-public Mailpit receiver)
        run: |
          set -a; source deploy/.env.deploy; set +a
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml -f deploy/docker-compose.test-smtp.yml \
            up -d --build mailpit
          # Phase 14's own established test-only override (already used
          # by scripts/verify-phase14-multitenant-security.sh) --
          # Better Auth's real, strict sign-in-specific rate limit
          # (window 10s/max 3) otherwise trips against this script's own
          # back-to-back real sign-ins; never set outside an explicit
          # test run, and reverted immediately after this step.
          WEB_CONSOLE_DISABLE_SPECIAL_RATE_LIMITS=true docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml -f deploy/docker-compose.test-smtp.yml \
            up -d --build --wait --wait-timeout 120 web-console
          # CORRECTION ROUND: the script previously hardcoded
          # "https://arp-deploy.test" and "deploy/caddy_root.crt" --
          # neither matches this job's own real
          # DEPLOYMENT_PUBLIC_ORIGIN (arp-deploy-ci.test, already
          # exported above) or its own extracted CA path
          # (/tmp/caddy_root.crt, see the "Extract Caddy's local CA
          # root certificate" step). TEST_EMAIL_FLOWS_ORIGIN falls
          # back to the already-exported DEPLOYMENT_PUBLIC_ORIGIN on
          # its own; only the CA cert path needs to be set explicitly
          # here.
          #
          # CORRECTION ROUND -- real finding: this step's own
          # `WEB_CONSOLE_DISABLE_SPECIAL_RATE_LIMITS=true` override is
          # explicitly documented as "reverted immediately after this
          # step" (see comment above), but GitHub Actions runs each
          # `run:` block under `bash -e` -- if the test script below
          # ever failed, the step aborted on THAT line and the revert
          # (bringing web-console back up without the override) never
          # ran, leaving every LATER step in this job running against
          # relaxed rate limits. `set +e`/capture/`set -e` makes the
          # revert unconditional, and the step still correctly fails
          # overall via the final `exit`.
          set +e
          TEST_EMAIL_FLOWS_CA_CERT=/tmp/caddy_root.crt ./deploy/scripts/test-email-flows.sh
          test_status=$?
          set -e
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml \
            up -d --wait --wait-timeout 120 web-console
          exit "$test_status"

      - name: Real telemetry retention dry-run against the live stack (no deletion)
        run: |
          set -a; source deploy/.env.deploy; set +a
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml \
            exec -T retention-scheduler python3 ./prune-telemetry-samples.py

      - name: Real telemetry retention bounds/lock-timeout proof (disposable, isolated infra)
        # CORRECTION ROUND: the dry-run step above never exercises
        # --execute, bounds validation, or the lock-contention/
        # statement-timeout fix (scripts/prune-telemetry-samples.py's
        # MAX_RUNTIME_SECONDS used to only be checked BETWEEN batches,
        # never enforced on any single operation -- a lock-blocked
        # DELETE could hang indefinitely). This script is fully
        # self-contained (its own disposable Postgres instance/
        # network/images, real Flyway migrations, a real deliberately
        # held ACCESS EXCLUSIVE lock) and does not touch this job's
        # own running deployment stack at all.
        run: ./deploy/scripts/test-retention-timeout.sh

      - name: Real backup proof
        run: |
          set -a; source deploy/.env.deploy; set +a
          ./deploy/scripts/backup.sh
          latest="$(ls -td "${BACKUP_OUTPUT_DIR:-./deploy/backups}"/*/ | head -1)"
          echo "BACKUP_DIR=$latest" >> "$GITHUB_ENV"
          test -f "${latest}manifest.json" || { echo "FAIL: no manifest.json produced"; exit 1; }
          python3 -c "
          import json
          with open('${latest}manifest.json') as f:
              m = json.load(f)
          assert m.get('roles_dump_sha256') and m.get('db_dump_sha256'), 'manifest missing checksums'
          print('PASS: backup manifest has real checksums')
          "

      - name: Real restore proof -- into a brand-new, disposable target (never the deployment's own running database)
        run: |
          set -a; source deploy/.env.deploy; set +a
          network="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy -f docker-compose.yml -f deploy/docker-compose.override.yml ps -q postgres | xargs docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run -d --name arp-restore-proof-tgt-ci --network "$network" \
            -e POSTGRES_USER=restore_proof_super -e POSTGRES_PASSWORD=restore_proof_super_pw -e POSTGRES_DB=reliability_platform \
            pgvector/pgvector:pg18
          for _ in $(seq 1 30); do docker exec arp-restore-proof-tgt-ci pg_isready -U restore_proof_super >/dev/null 2>&1 && break; sleep 2; done
          RESTORE_CREDS="$(mktemp)"
          rm -f "$RESTORE_CREDS"
          TARGET_PGPASSWORD=restore_proof_super_pw ./deploy/scripts/restore.sh \
            --manifest "${BACKUP_DIR}manifest.json" \
            --docker-network "$network" \
            --target-host arp-restore-proof-tgt-ci --target-port 5432 --target-db reliability_platform \
            --target-superuser restore_proof_super --target-superuser-password-env TARGET_PGPASSWORD \
            --credentials-out "$RESTORE_CREDS"
          echo "=== real post-restore proof: incidents table + role set exist on the restored target ==="
          docker exec -e PGPASSWORD=restore_proof_super_pw arp-restore-proof-tgt-ci \
            psql -U restore_proof_super -d reliability_platform -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM reliability.incidents;" \
            -c "SELECT rolname FROM pg_roles WHERE rolname IN ('control_plane_app','retrieval_app','web_console','agent_runtime') ORDER BY rolname;"
          docker rm -f arp-restore-proof-tgt-ci
          rm -f "$RESTORE_CREDS"

      - name: Real restore-then-live-login proof (disposable, isolated infra -- not merely SQL introspection)
        # CORRECTION ROUND: the SQL-only check above (table/role
        # existence) is "additional evidence, never a substitute" for
        # proving a restored database is actually usable by the real
        # application. This script is fully self-contained -- its own
        # disposable source+target Postgres instances, its own real
        # web-console/control-plane images/containers, its own
        # network -- and proves: a real user signs up, verifies
        # (local-dev log-fallback link, not faked), signs in, and
        # creates a real organization against a SOURCE stack; after a
        # real backup.sh-shaped backup and the real, now-fixed
        # restore.sh run into a brand-new TARGET, NEW web-console/
        # control-plane containers using restore.sh's own freshly
        # generated role passwords let that SAME user sign in again
        # and read back the SAME organization and a real,
        # organization-tagged incident row, through control-plane's
        # real HTTP API (not a raw SQL substitute). Does not touch
        # this job's own running deployment stack.
        run: ./deploy/scripts/test-restore-live-login-proof.sh

      - name: Real OTLP deployment-endpoint export proof (rendered onboarding snippet + official Python SDK ingestion)
        # CORRECTION ROUND (second pass), item 5's first acknowledged
        # missing deployment check: proves the real onboarding flow
        # (sign up, verify, sign in, register a service, generate a
        # credential) renders a copyable snippet whose endpoint is the
        # real deployment's own public origin, and that the official
        # `opentelemetry-exporter-otlp-proto-http` SDK, configured
        # with exactly that snippet, actually exports through the
        # real Caddy reverse proxy to control-plane. Fully
        # self-contained disposable infra; does not touch this job's
        # own running deployment stack.
        run: ./deploy/scripts/test-otlp-deployment-export-proof.sh

      - name: OTLP proof cleanup-ownership regressions (early build failure, name collisions with unrelated containers)
        # CORRECTION ROUND (third pass), item 2: the OTLP export proof
        # above used to `docker rm -f "web-console" "control-plane"
        # "caddy"` unconditionally on EXIT, even on an early failure
        # before any container existed -- deleting any unrelated
        # containers already running under those exact bare names.
        # Pre-creates real decoy containers literally named
        # "control-plane"/"web-console", fault-injects the real proof
        # script above (an early `docker build` failure, and a later
        # Flyway-migration failure after several real resources
        # exist), and proves the decoys are never touched while every
        # resource the fault-injected run itself created is cleaned
        # up. Does not touch this job's own running deployment stack.
        run: ./deploy/scripts/test-otlp-proof-cleanup-regressions.sh

      - name: Real cross-tenant resource denial and revoked-credential rejection proofs (disposable, isolated infra)
        # CORRECTION ROUND (second pass), item 5's remaining two
        # acknowledged missing deployment checks: proves, through a
        # real Caddy+web-console+control-plane stack, that (1) an
        # authenticated user in one real organization cannot read
        # another real organization's resources, and (2) a revoked
        # integration credential is rejected on ingestion, exercised
        # with a fresh failure budget so an unrelated rate limit
        # cannot be mistaken for the real revocation check. Fully
        # self-contained disposable infra; does not touch this job's
        # own running deployment stack.
        run: ./deploy/scripts/test-cross-tenant-and-revocation-proof.sh

      - name: Show deployment stack logs on failure
        if: failure()
        run: |
          set -a; source deploy/.env.deploy; set +a
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml logs --tail=200

      - name: Tear down the disposable deployment stack and its volumes
        if: always()
        run: |
          set -a; source deploy/.env.deploy; set +a
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file deploy/.env.deploy \
            -f docker-compose.yml -f deploy/docker-compose.override.yml down --volumes || true

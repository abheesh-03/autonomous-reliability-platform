# OpenTelemetry Collector configuration for local development.
#
# Phase 2A.1 scope: infrastructure bootstrap. Phase 2A.2 added real
# telemetry from checkout-service, Phase 2A.3 added payment-service,
# Phase 2A.4 added inventory-service, and Phase 2A.5 added
# notification-service — all four application services now send real
# OTLP metrics and traces, completing one distributed trace across the
# whole checkout workflow (checkout-service and its three downstream
# branches: payment, inventory, notification — siblings, not a
# sequential chain).
#
# Phase 2B.1: the traces pipeline now exports to BOTH the "debug"
# exporter (kept intentionally — scripts/verify-observability.sh and
# scripts/parse-checkout-trace.py still read Collector logs) AND a new
# OTLP exporter pointed at Tempo, a persistent, queryable trace backend.
# Metrics are unchanged: re-exposed in Prometheus format and scraped by
# Prometheus. The Collector's own internal ("self") telemetry on port
# 8888 is unaffected by any of this. The metrics pipeline is completely
# unchanged; only the traces pipeline gained a second exporter — no new
# pipelines, receivers, or processors were added.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Re-exposes OTLP metrics in Prometheus format. resource_to_telemetry_conversion
  # is the current (non-deprecated) mechanism for turning OTel resource
  # attributes — e.g. service.name — into Prometheus labels (service_name),
  # since Prometheus has no native resource concept of its own.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Prints received traces to Collector logs — kept alongside the Tempo
  # exporter below (Phase 2B.1) because the existing local verifier and
  # scripts/parse-checkout-trace.py still read trace evidence from these
  # logs. Not used for metrics.
  debug:
    verbosity: detailed
  # Phase 2B.1: exports traces to Tempo's OTLP gRPC receiver over the
  # internal Compose network (not published to the host). `insecure:
  # true` disables TLS, matching every other internal OTLP path in this
  # stack (application services -> otel-collector is also plaintext).
  # Uses the "otlp_grpc" type explicitly, not the "otlp" alias — the
  # Collector logs a deprecation warning ("\"otlp\" alias is deprecated;
  # use \"otlp_grpc\" instead") for the older name, confirmed empirically
  # against this pinned 0.161.0 build.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_grpc/tempo]

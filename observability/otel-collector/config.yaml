# OpenTelemetry Collector configuration for local development.
#
# Phase 2A.1 scope: infrastructure bootstrap. Phase 2A.2 added real
# telemetry from checkout-service, Phase 2A.3 added payment-service,
# Phase 2A.4 added inventory-service, and Phase 2A.5 added
# notification-service — all four application services now send real
# OTLP metrics and traces, completing one distributed trace across the
# whole checkout workflow (checkout-service and its three downstream
# branches: payment, inventory, notification — siblings, not a
# sequential chain).
#
# Traces still go to the "debug" exporter only. There is intentionally
# no trace backend (Tempo/Jaeger/etc.) yet — that belongs to a later
# phase. Metrics are re-exposed in Prometheus format and scraped by
# Prometheus. The Collector's own internal ("self") telemetry on port
# 8888 is unaffected by any of this. No new pipelines or exporters have
# been added since Phase 2A.1 — every instrumented service's telemetry
# flows through the same two pipelines below.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Re-exposes OTLP metrics in Prometheus format. resource_to_telemetry_conversion
  # is the current (non-deprecated) mechanism for turning OTel resource
  # attributes — e.g. service.name — into Prometheus labels (service_name),
  # since Prometheus has no native resource concept of its own.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Phase 2A.2 only: prints received traces to Collector logs so they
  # can be inspected without a trace backend, which is intentionally not
  # added yet. Not used for metrics.
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

# Local development infrastructure for the Autonomous Production
# Reliability Platform.
#
# Services:
#   - postgres: local PostgreSQL database (Phase 0.2)
#   - checkout-service: first application service bootstrap (Phase 1A.1).
#     It does not connect to PostgreSQL yet and has no business logic.
#   - payment-service: second application service bootstrap (Phase 1A.2).
#     It does not connect to PostgreSQL and does not talk to
#     checkout-service yet; it has no payment business logic.
#
# Configuration comes entirely from environment variables (see
# .env.example). Copy .env.example to .env and adjust values locally;
# .env is gitignored and must never be committed.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # PostgreSQL 18's official image expects a single mount at
    # /var/lib/postgresql (not .../data) — see
    # https://github.com/docker-library/postgres/pull/1259
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  checkout-service:
    build:
      context: ./services/checkout-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  payment-service:
    build:
      context: ./services/payment-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:

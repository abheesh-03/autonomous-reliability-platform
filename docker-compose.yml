# Local development infrastructure for the Autonomous Production
# Reliability Platform.
#
# Services:
#   - postgres: local PostgreSQL database (Phase 0.2). Not used by any
#     of the four demo application services for business data (still
#     true as of Phase 3B). As of Phase 3A, it does hold the new
#     "reliability" schema (reliability.incidents) — the durable
#     incident-data foundation the control plane below reads — applied
#     via the "flyway" service below, never written to directly.
#   - flyway (Phase 3A): applies versioned migrations from
#     database/migrations/ to the "reliability" schema only (never
#     "public", which already holds an unrelated pre-existing Phase 0
#     table). Never started by `docker compose up -d` (profiles:
#     [tools]) — only via `make db-migrate` or an explicit
#     `docker compose run`.
#   - control-plane (Phase 3B, extended Phase 3C): a FastAPI service
#     over reliability.incidents — the first real backend application
#     built on the Phase 3A incident model. Not one of the four demo
#     commerce services; does not call or get called by any of them.
#     Depends only on postgres being healthy, never on flyway
#     (migrations are an explicit, separate step — see above); its own
#     readiness endpoint, not container startup, is what reports
#     whether the incidents table actually exists yet. Its GET API
#     remains read-only and unauthenticated (local dev only); as of
#     Phase 3C it also exposes ONE authenticated write path,
#     POST /internal/v1/alertmanager/webhook (Bearer token, see
#     CONTROL_PLANE_WEBHOOK_TOKEN below), which Alertmanager calls to
#     turn a real firing alert into a reliability.incidents row.
#   - checkout-service: orchestrates payment authorization, inventory
#     reservation, and notification triggering via POST /checkouts
#     (Phase 1B.4) — the first service-to-service workflow in this
#     repository. It calls payment-service, inventory-service, and
#     notification-service sequentially; they never call each other or
#     call back into checkout-service. It does not connect to PostgreSQL.
#   - payment-service: exposes a simulated POST /payments/authorize
#     (Phase 1B.1). No real payment provider, persistence, or database.
#   - inventory-service: exposes a simulated POST /inventory/reservations
#     (Phase 1B.2). No real stock tracking, persistence, or database.
#   - notification-service: exposes a simulated POST /notifications
#     (Phase 1B.3). No real message delivery, persistence, or database.
#   - otel-collector / prometheus / grafana: observability infrastructure
#     bootstrap (Phase 2A.1). As of Phase 2A.5, all four application
#     services send it real OTLP telemetry (metrics + traces), and one
#     real POST /checkouts produces a complete distributed trace across
#     checkout-service and all three of its downstream branches
#     (payment, inventory, notification — siblings, not a sequential
#     chain). Prometheus scrapes itself, the Collector's own telemetry,
#     and the Collector's application-metrics relay; Grafana has
#     Prometheus provisioned as its datasource.
#   - tempo: a persistent, queryable distributed-tracing backend
#     (Phase 2B.1). The Collector's traces pipeline now exports to both
#     Tempo and its existing debug exporter. Real checkout traces are
#     retrievable from Tempo's own HTTP query API, not just from
#     Collector logs. Grafana has Tempo provisioned as a second
#     datasource alongside Prometheus.
#   - loki / alloy: centralized application log collection and
#     persistent storage (Phase 2B.2). Alloy reads the real stdout/
#     stderr of the four application containers directly from Docker
#     (not via the OTel Collector — this is a separate path) and ships
#     them to Loki. Grafana has Loki provisioned as a third datasource.
#   - grafana dashboards (Phase 2B.3): three dashboards
#     (observability/grafana/provisioning/dashboards/json/) are
#     auto-provisioned on startup — Application Health (Prometheus),
#     Centralized Logging (Loki), and Observability Infrastructure
#     (Prometheus/Collector self-telemetry). No new services; only
#     Grafana's own provisioning config changed.
#   - alertmanager (Phase 2B.4, extended Phase 3C): Prometheus evaluates
#     the alert rules in observability/prometheus/rules/ and routes any
#     firing alert to Alertmanager, which receives, groups, and tracks
#     alert state through its own real API. As of Phase 3C its single
#     receiver is a real, authenticated webhook to control-plane's
#     internal ingestion endpoint (see above) — no longer a no-op
#     "null" sink. Still no email/Slack/PagerDuty integration.
#   - investigator-service (Phase 5): a STRICTLY READ-ONLY sixth
#     backend application. Given an existing incident UUID, it reads
#     that incident's real evidence from control-plane's existing GET
#     APIs plus read-only Prometheus/Loki/Tempo queries, and returns a
#     structured, evidence-grounded AI investigation via a configurable
#     LLM provider (OpenAI; absent an API key, it still starts and
#     still serves evidence-only responses, but a real investigation
#     request fails explicitly rather than faking one). It is never
#     given CONTROL_PLANE_WEBHOOK_TOKEN or CONTROL_PLANE_LIFECYCLE_TOKEN
#     (it has no use for either — it never calls a write-capable
#     control-plane endpoint) and holds no PostgreSQL credentials at
#     all.
#
# Configuration comes entirely from environment variables (see
# .env.example). Copy .env.example to .env and adjust values locally;
# .env is gitignored and must never be committed.

services:
  # Phase 6: swapped from the official postgres:18 image to
  # pgvector/pgvector:pg18 -- a pgvector-maintained image built FROM
  # PostgreSQL 18 (confirmed empirically: identical PG_VERSION/PGDATA
  # path/volume mount as the official image; this is an additive
  # capability swap, never a downgrade) that bundles the pgvector
  # extension (confirmed: vector.control default_version 0.8.7) so
  # V5__create_retrieval_index.sql's `CREATE EXTENSION vector` has
  # something to load. The existing named volume (postgres_data) is
  # reused UNCHANGED -- confirmed locally, before this phase was
  # considered complete, that real pre-existing reliability.incidents/
  # reliability.incident_events rows survive this exact image swap
  # byte-for-byte (see docs/architecture/phase-6-rag-retrieval.md's
  # "Data safety during PostgreSQL image change" section for the full
  # before/after proof) -- never docker compose down -v, never a
  # manually recreated volume.
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # PostgreSQL 18's official image expects a single mount at
    # /var/lib/postgresql (not .../data) — see
    # https://github.com/docker-library/postgres/pull/1259
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Phase 3A: versioned database migrations via Flyway. `profiles:
  # [tools]` means this is NEVER started by a normal `docker compose up
  # -d` (it has no healthcheck and nothing depends on it) — it only
  # runs when explicitly invoked, via `make db-migrate` or
  # `docker compose run --rm flyway <command>`. Runs only against the
  # "reliability" schema (never "public", which already holds an
  # unrelated pre-existing table from Phase 0), confirmed empirically
  # against the real pinned Postgres 18 image before being adopted.
  flyway:
    image: flyway/flyway:13.9.0
    profiles: ["tools"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: reliability
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: ["migrate"]

  # Phase 3B: the first real backend application reading
  # reliability.incidents — a read-only FastAPI control plane. Not one
  # of the four demo commerce services below, and does not call or get
  # called by any of them. Deliberately does NOT depend on the
  # `flyway` service above (which never runs automatically anyway,
  # being gated behind profiles: ["tools"]) — only on `postgres` itself
  # being healthy. The incidents table may not exist yet when this
  # container starts (e.g. before `make db-migrate` has ever been run
  # on a fresh checkout); GET /health/ready is what actually reports
  # that, not container startup success — see
  # services/control-plane/src/control_plane/db/engine.py and
  # docs/api/control-plane.md.
  control-plane:
    build:
      context: ./services/control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Phase 3C: shared secret for POST /internal/v1/alertmanager/webhook
      # (see services/control-plane/src/control_plane/api/auth.py).
      # Generated locally by scripts/init-webhook-secret.sh, never
      # committed. Defaults to empty so `docker compose config` and a
      # clean startup both still work before that script has ever run
      # — an empty/unset token just means every webhook request fails
      # closed (401); it does not affect the read-only API at all.
      CONTROL_PLANE_WEBHOOK_TOKEN: ${CONTROL_PLANE_WEBHOOK_TOKEN:-}
      # Phase 3D: a SEPARATE secret for the human/operator lifecycle
      # endpoint, PATCH /api/v1/incidents/{id}/status. Deliberately
      # never the same value as CONTROL_PLANE_WEBHOOK_TOKEN above —
      # Alertmanager is only ever given the webhook token (it has no
      # way to read this one), so it cannot invoke this endpoint.
      # Also generated by scripts/init-webhook-secret.sh and also
      # defaults to empty for the same docker-compose-config-before-
      # secret-init reason as above.
      CONTROL_PLANE_LIFECYCLE_TOKEN: ${CONTROL_PLANE_LIFECYCLE_TOKEN:-}
      # Phase 8: three more SEPARATE secrets, generated by
      # scripts/init-remediation-secrets.sh, never interchangeable
      # with each other or with the two above (see
      # core/config.py's own resolve_write_tokens guard and
      # api/auth.py). CONTROL_PLANE_REMEDIATION_PROPOSAL_TOKEN is held
      # by agent-runtime-service, CONTROL_PLANE_REMEDIATION_APPROVER_TOKEN
      # by a human/operator (or a CI acceptance script simulating one)
      # ONLY, and CONTROL_PLANE_REMEDIATION_EXECUTOR_TOKEN by
      # tool-gateway ONLY.
      CONTROL_PLANE_REMEDIATION_PROPOSAL_TOKEN: ${CONTROL_PLANE_REMEDIATION_PROPOSAL_TOKEN:-}
      CONTROL_PLANE_REMEDIATION_APPROVER_TOKEN: ${CONTROL_PLANE_REMEDIATION_APPROVER_TOKEN:-}
      CONTROL_PLANE_REMEDIATION_EXECUTOR_TOKEN: ${CONTROL_PLANE_REMEDIATION_EXECUTOR_TOKEN:-}
    # Bound to loopback only, like every other observability/infra port
    # in this stack. No authentication exists yet — see
    # docs/api/control-plane.md's security-limitations section; this is
    # local-development-only.
    ports:
      - "127.0.0.1:8000:8000"
    # /health/live, not /health/ready: liveness must stay independent
    # of whether the migration has been applied yet (see the comment
    # above) — a container that's merely "not ready" is not the same as
    # "unhealthy", and Docker restarting it wouldn't fix a missing
    # migration anyway. python:3.13-slim has no curl/wget, matching
    # payment-service's own healthcheck pattern below.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Phase 6: owns the pgvector-backed retrieval index
  # (reliability.retrieval_chunks). Unlike investigator-service, this
  # service DOES hold PostgreSQL credentials (it is the only
  # application besides control-plane that does) -- it never reads
  # CONTROL_PLANE_WEBHOOK_TOKEN/CONTROL_PLANE_LIFECYCLE_TOKEN, and its
  # control-plane client (used only by its offline indexer, never by
  # its HTTP app) has no write method at all. Its HTTP API
  # (POST /api/v1/retrieval/search) is read-only; writes happen only
  # via the separate `python -m retrieval_service.indexer` / `make
  # rag-index`, run explicitly, never from an HTTP handler. The
  # source-controlled knowledge/ directory is mounted read-only and is
  # the ONLY filesystem root the indexer will ever read from.
  retrieval-service:
    build:
      context: ./services/retrieval-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    volumes:
      - ./knowledge:/knowledge:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RETRIEVAL_CONTROL_PLANE_URL: http://control-plane:8000
      RETRIEVAL_KNOWLEDGE_ROOT: /knowledge
      # "local" (default) uses the deterministic, offline lexical
      # hashing provider -- always available, no credential, what
      # normal CI and scripts/verify-rag.sh both use. "openai" uses a
      # real embedding model and REQUIRES RETRIEVAL_EMBEDDING_API_KEY
      # -- a credential DISTINCT from investigator-service's own
      # INVESTIGATOR_LLM_API_KEY; this service has no reason to ever
      # see that one. Never a real credential committed here.
      RETRIEVAL_EMBEDDING_PROVIDER: ${RETRIEVAL_EMBEDDING_PROVIDER:-local}
      RETRIEVAL_EMBEDDING_API_KEY: ${RETRIEVAL_EMBEDDING_API_KEY:-}
      RETRIEVAL_EMBEDDING_MODEL: ${RETRIEVAL_EMBEDDING_MODEL:-text-embedding-3-small}
      RETRIEVAL_EMBEDDING_BASE_URL: ${RETRIEVAL_EMBEDDING_BASE_URL:-}
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  investigator-service:
    build:
      context: ./services/investigator-service
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      # Read-only clients, pointed at this stack's own internal
      # Compose DNS names. No PostgreSQL credentials and NEITHER of
      # control-plane's write-capable Bearer tokens
      # (CONTROL_PLANE_WEBHOOK_TOKEN / CONTROL_PLANE_LIFECYCLE_TOKEN)
      # are given to this service — it has no use for either, since it
      # never calls a write-capable control-plane endpoint (see
      # services/investigator-service/src/investigator_service/clients/control_plane.py).
      INVESTIGATOR_CONTROL_PLANE_URL: http://control-plane:8000
      INVESTIGATOR_PROMETHEUS_URL: http://prometheus:9090
      INVESTIGATOR_LOKI_URL: http://loki:3100
      INVESTIGATOR_TEMPO_URL: http://tempo:3200
      # Phase 6: the read-only RAG retrieval client (Phase 6 §11).
      # NEITHER a PostgreSQL credential NOR retrieval-service's own
      # database access -- this is a plain HTTP URL to
      # retrieval-service's search-only API, same trust boundary as
      # the Prometheus/Loki/Tempo URLs above. Retrieval unavailability
      # degrades gracefully (Phase 6 §16): investigation still
      # succeeds using Phase 5 evidence alone.
      INVESTIGATOR_RETRIEVAL_URL: http://retrieval-service:8002
      # Phase 5: the one real, configurable LLM provider (OpenAI).
      # Defaults to empty so `docker compose config` and a clean
      # startup both still work with no key ever set — this service
      # still starts and still serves evidence-only responses;
      # POST /api/v1/investigations instead returns an explicit 503
      # for an actual investigation request. Never a real credential
      # committed here; set INVESTIGATOR_LLM_API_KEY in your own
      # gitignored .env to enable real AI investigation.
      INVESTIGATOR_LLM_API_KEY: ${INVESTIGATOR_LLM_API_KEY:-}
      INVESTIGATOR_LLM_MODEL: ${INVESTIGATOR_LLM_MODEL:-gpt-4o-mini}
      INVESTIGATOR_LLM_BASE_URL: ${INVESTIGATOR_LLM_BASE_URL:-}
      # "openai" (default) or "stub". Only scripts/verify-investigator.sh
      # ever sets this to "stub", to exercise this service's real
      # HTTP/evidence pipeline deterministically in CI without a real
      # API key — see LLMSettings' own docstring. Never set this
      # yourself for real use.
      INVESTIGATOR_LLM_PROVIDER: ${INVESTIGATOR_LLM_PROVIDER:-openai}
    # Bound to loopback only, like every other observability/infra port
    # in this stack. No authentication exists yet, matching
    # control-plane's own GET API (this service's read endpoints
    # evaluate incident evidence, they do not expose anything more
    # sensitive) — local-development-only.
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Phase 7 established the durable LangGraph agent runtime. Phase 8
  # extends the SAME checkpointed StateGraph (load_incident ->
  # run_investigation -> evaluate_investigation -> propose_remediation
  # -> [await_human_approval -> execute_remediation -> verify_recovery]
  # -> finalize) with a deterministic-policy remediation proposal, a
  # real LangGraph human-approval interrupt, and tool-gateway-mediated
  # execution of exactly one allowlisted action -- it never
  # re-implements Phase 5/6's own evidence collection or RAG retrieval,
  # and it never calls a control-plane write endpoint for incident
  # lifecycle itself (no CONTROL_PLANE_WEBHOOK_TOKEN/
  # CONTROL_PLANE_LIFECYCLE_TOKEN given here). Unlike investigator-
  # service, this service DOES hold PostgreSQL credentials -- but a
  # dedicated, least-privileged `agent_runtime` role/schema
  # (scripts/init-agent-runtime-db.sh), never the shared
  # POSTGRES_USER/POSTGRES_PASSWORD role control-plane/retrieval-service
  # use. As of Phase 8 it also holds exactly two narrow remediation
  # credentials (CONTROL_PLANE_REMEDIATION_PROPOSAL_TOKEN -- create a
  # proposal only -- and TOOL_GATEWAY_EXECUTION_TOKEN -- ask
  # tool-gateway to execute an already-approved action only). It still
  # has NO direct infrastructure/application mutation capability of its
  # own: no incident-lifecycle write token, no payment-service
  # credential of any kind, no Docker socket, no shell/subprocess
  # execution, no Kubernetes/AWS access — see
  # docs/architecture/phase-7-durable-agent-runtime.md and
  # docs/architecture/phase-8-human-approval-remediation.md.
  agent-runtime-service:
    build:
      context: ./services/agent-runtime-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      tool-gateway:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      # The dedicated, least-privileged checkpoint-database role
      # (never POSTGRES_USER/POSTGRES_PASSWORD) — generated locally by
      # scripts/init-agent-runtime-db.sh. Defaults to empty so
      # `docker compose config` always succeeds even before that
      # script has ever run.
      #
      # Phase 7 correction round (finding #1): an empty/invalid
      # password does NOT degrade to a merely-unready service. This
      # service's `main.py` opens its real PostgreSQL checkpoint
      # connection during FastAPI's own `lifespan` startup, awaited
      # directly and uncaught — a bad credential makes the ASGI
      # application fail to start at all (this container then
      # crash-loops under `restart: unless-stopped` until the healthy
      # dependency exists), never a graceful "/health/ready: 503".
      # This is DELIBERATE fail-fast behavior (durable PostgreSQL
      # persistence is this service's core dependency, not an optional
      # one) — not a bug, and not something `docker compose up -d`
      # alone can paper over. `make db-up` provisions the real
      # password via scripts/init-agent-runtime-db.sh BEFORE this
      # container is ever created (see that target's own ordering
      # comment in the Makefile) specifically so this container is
      # never created with an empty/stale credential in the first
      # place. Running `docker compose up -d` directly on a brand-new
      # `.env`, bypassing `make db-up`, will reproduce exactly this
      # crash-loop — recreate the container
      # (`docker compose up -d agent-runtime-service`) after running
      # `./scripts/init-agent-runtime-db.sh`.
      AGENT_RUNTIME_DB_USER: ${AGENT_RUNTIME_DB_USER:-agent_runtime}
      AGENT_RUNTIME_DB_PASSWORD: ${AGENT_RUNTIME_DB_PASSWORD:-}
      AGENT_RUNTIME_CONTROL_PLANE_URL: http://control-plane:8000
      AGENT_RUNTIME_INVESTIGATOR_URL: http://investigator-service:8001
      # Phase 8: exactly TWO narrow, additional credentials -- never
      # CONTROL_PLANE_REMEDIATION_APPROVER_TOKEN/
      # CONTROL_PLANE_REMEDIATION_EXECUTOR_TOKEN, and never any
      # payment-service credential (see
      # tests/test_read_only_guarantees.py's structural proof).
      CONTROL_PLANE_REMEDIATION_PROPOSAL_TOKEN: ${CONTROL_PLANE_REMEDIATION_PROPOSAL_TOKEN:-}
      AGENT_RUNTIME_TOOL_GATEWAY_URL: http://tool-gateway:8004
      TOOL_GATEWAY_EXECUTION_TOKEN: ${TOOL_GATEWAY_EXECUTION_TOKEN:-}
    # Bound to loopback only, like every other observability/infra port
    # in this stack. No authentication exists yet, matching every
    # other service's own local-development trust boundary.
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health/live', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  checkout-service:
    build:
      context: ./services/checkout-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CHECKOUT_PAYMENT_BASE_URL: http://payment-service:8081
      CHECKOUT_INVENTORY_BASE_URL: http://inventory-service:8082
      CHECKOUT_NOTIFICATION_BASE_URL: http://notification-service:8083
      # OpenTelemetry Java agent (Phase 2A.2) — attached via
      # JAVA_TOOL_OPTIONS rather than baked into the image's ENTRYPOINT,
      # so the same image still runs with no telemetry when launched
      # outside this Compose stack. As of Phase 2A.5, payment-service
      # (Python zero-code auto-instrumentation), inventory-service
      # (manual Go SDK init), and notification-service (manual Node SDK
      # init) are also instrumented — see their own service blocks
      # below. All four application services now send telemetry.
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: checkout-service
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0,deployment.environment.name=local"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      # Short export intervals for deterministic local verification.
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  payment-service:
    build:
      context: ./services/payment-service
    restart: unless-stopped
    # OpenTelemetry zero-code auto-instrumentation (Phase 2A.3) — the
    # Dockerfile's own CMD is plain Uvicorn with no telemetry, so this
    # image still runs normally when launched standalone. Only this
    # Compose environment opts into instrumentation, by wrapping the
    # same Uvicorn invocation with `opentelemetry-instrument`.
    command: ["opentelemetry-instrument", "uvicorn", "payment_service.main:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    environment:
      OTEL_SERVICE_NAME: payment-service
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0,deployment.environment.name=local"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      # Short export intervals for deterministic local verification.
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      # Aligns HTTP semantic conventions with checkout-service's Java
      # agent (which already emits the stable conventions by default).
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      # Phase 8: the controlled authorization fault (see
      # src/payment_service/fault_state.py). Disabled by default --
      # scripts/verify-remediation.sh explicitly enables it for the
      # duration of its own acceptance run only; it is never active
      # merely because the token below happens to be configured. Two
      # SEPARATE, never-interchangeable credentials: the injection
      # token (test/operator-only, tool-gateway never receives it) and
      # the remediation token (tool-gateway's ONE payment-service
      # credential, used for CLEAR and the read-only status check,
      # never for ENABLE).
      PAYMENT_FAULT_INJECTION_ENABLED: ${PAYMENT_FAULT_INJECTION_ENABLED:-false}
      PAYMENT_FAULT_INJECTION_TOKEN: ${PAYMENT_FAULT_INJECTION_TOKEN:-}
      PAYMENT_REMEDIATION_TOKEN: ${PAYMENT_REMEDIATION_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Phase 8: the ONE service that may ever mutate anything downstream
  # of a human-approved remediation proposal. Go, no Docker socket, no
  # shell/subprocess execution, hard allowlist (exactly one action --
  # see internal/allowlist/allowlist.go) -- see
  # docs/architecture/phase-8-human-approval-remediation.md for the
  # full design and threat model.
  tool-gateway:
    build:
      context: ./services/tool-gateway
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    environment:
      TOOL_GATEWAY_LISTEN_ADDR: 0.0.0.0:8004
      TOOL_GATEWAY_CONTROL_PLANE_URL: http://control-plane:8000
      TOOL_GATEWAY_PAYMENT_URL: http://payment-service:8081
      # Verifies the Authorization header on incoming requests (both
      # the execute and the capability/precondition endpoints) --
      # agent-runtime-service holds this SAME value to call in.
      TOOL_GATEWAY_EXECUTION_TOKEN: ${TOOL_GATEWAY_EXECUTION_TOKEN:-}
      # What this service presents TO control-plane/payment-service --
      # never the proposal/approver tokens, never the fault-injection
      # token (see services/tool-gateway/internal/config/config.go's
      # own docstring).
      CONTROL_PLANE_REMEDIATION_EXECUTOR_TOKEN: ${CONTROL_PLANE_REMEDIATION_EXECUTOR_TOKEN:-}
      PAYMENT_REMEDIATION_TOKEN: ${PAYMENT_REMEDIATION_TOKEN:-}
    ports:
      - "127.0.0.1:8004:8004"
    # Runtime image is distroless (no shell, no curl/wget), so the
    # binary's own "healthcheck" subcommand is used via exec form --
    # same convention inventory-service's own Go service already
    # establishes.
    healthcheck:
      test: ["CMD", "/tool-gateway", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  inventory-service:
    build:
      context: ./services/inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      # OpenTelemetry (Phase 2A.4) — manual Go SDK initialization in
      # internal/telemetry, run only from the normal server startup
      # path (cmd/inventory-service/main.go's run()), never from the
      # "healthcheck" subcommand below, which exits before that code
      # runs and so never touches the Collector.
      OTEL_SERVICE_NAME: inventory-service
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0,deployment.environment.name=local"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Short export intervals for deterministic local verification;
      # honored by the Go SDK's own env-aware BatchSpanProcessor/
      # PeriodicReader defaults (not explicitly overridden in code).
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    # Runtime image is distroless (no shell, no curl/wget), so the
    # binary's own "healthcheck" subcommand is used via exec form.
    healthcheck:
      test: ["CMD", "/inventory-service", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  notification-service:
    build:
      context: ./services/notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      # OpenTelemetry (Phase 2A.5) — manual Node SDK initialization in
      # src/telemetry.ts, started from a dedicated src/bootstrap.ts
      # entrypoint (dist/bootstrap.js) that starts telemetry before
      # dynamically importing dist/server.js — required so @fastify/otel's
      # module-patching takes effect before Fastify is ever constructed.
      # Unlike payment-service's Compose-activated approach, the
      # Dockerfile's own CMD points at dist/bootstrap.js directly (ESM
      # module-evaluation ordering makes a Compose-level command
      # override impractical here); without OTLP env vars, the SDK
      # still starts but has nothing configured to export to.
      OTEL_SERVICE_NAME: notification-service
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0,deployment.environment.name=local"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Short export intervals for deterministic local verification.
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    # No curl/wget installed solely for the healthcheck — Node's
    # built-in fetch (with a bounded timeout) is used instead.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8083/health', { signal: AbortSignal.timeout(3000) }).then(r => { if (!r.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # Bound to loopback only — these ports (OTLP + health_check) have no
    # authentication, so they should not be reachable from outside this
    # machine even in local development.
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC (future application telemetry)
      - "127.0.0.1:4318:4318" # OTLP HTTP (future application telemetry)
      - "127.0.0.1:13133:13133" # health_check extension
    # The official Contrib image is a single static binary with no
    # shell, wget, or curl, so no Docker-level HEALTHCHECK can be
    # defined here without modifying the image. Liveness is instead
    # verified via the exposed health_check port (13133, reachable from
    # the host/other containers) and, more meaningfully, via Prometheus
    # reporting this service's scrape target as "up".

  tempo:
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    # Only the HTTP query API is published to the host; Tempo's OTLP
    # receiver (gRPC :4317 / HTTP :4318, distinct container from
    # otel-collector's own same-numbered ports) stays internal to the
    # Compose network — only otel-collector talks to it, as
    # tempo:4317/tempo:4318.
    ports:
      - "127.0.0.1:3200:3200"
    # The image has no shell and no curl/wget (ENTRYPOINT is the /tempo
    # binary directly, confirmed via `docker inspect`), so the
    # healthcheck uses the binary's own built-in "-health" mode instead
    # — confirmed empirically: `/tempo -health` performs a GET against
    # its own http://localhost:3200/ready and exits 0/1 accordingly,
    # printing "Tempo is healthy" on success.
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    # Only the HTTP API is published to the host.
    ports:
      - "127.0.0.1:3100:3100"
    # Like tempo and otel-collector, this image has no shell and no
    # curl/wget (ENTRYPOINT is /usr/bin/loki directly, confirmed via
    # `docker inspect`), and — unlike Tempo — the /usr/bin/loki binary
    # has no built-in "-health"-style flag either (confirmed via
    # `-help`). No Docker-level HEALTHCHECK is possible here; readiness
    # is instead verified functionally from the host via
    # `curl http://127.0.0.1:3100/ready` in scripts/verify-observability.sh
    # and CI, the same pattern already used for otel-collector.

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    environment:
      # ${COMPOSE_PROJECT_NAME} is Compose's own interpolation variable
      # for its actual effective project name for this run (derived
      # from the checkout directory name by default, or from an
      # explicit "-p"/COMPOSE_PROJECT_NAME override) — not a value we
      # set ourselves. Passed through so observability/alloy/config.alloy
      # can match discovered containers' "com.docker.compose.project"
      # label against this exact value via sys.env(...), instead of a
      # literal hard-coded project name that would silently collect
      # nothing under a differently-named checkout directory.
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Grants Alloy full Docker daemon API access (equivalent to root
      # on the host running this daemon), not just read access to
      # container logs — the Docker API has no separate "logs-only"
      # permission scope, and `:ro` on this mount only stops Alloy from
      # replacing/deleting the socket special file itself; it does NOT
      # restrict which Docker API calls Alloy can make through it. The
      # Docker API itself is never published on any host port.
      #
      # This same docker-compose.yml is also used by CI
      # (.github/workflows/ci.yml, via `make db-up` / `docker compose up
      # -d`), including on `pull_request` from forks, so Alloy's socket
      # mount IS active there too — it is not local-dev-only in
      # practice. That is judged acceptable, not because the mount is
      # somehow restricted, but because it adds no meaningful privilege
      # beyond what that CI job already has: the job's own steps
      # (./mvnw test, npm ci, go test ./..., pip install -e) already
      # execute arbitrary PR-authored code directly on the runner with
      # the runner's own ambient Docker access (the `docker compose`
      # commands in this workflow are not sandboxed away from it
      # either), on a single-use VM with no persistent state and no
      # secrets exposed to fork PRs. If this workflow is ever changed to
      # run on shared/persistent/self-hosted runners, or to use
      # `pull_request_target`, this reasoning no longer holds and this
      # mount (and the rest of this CI job) would need to be
      # reconsidered.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # Default listen address is 127.0.0.1:12345 (loopback *inside* the
      # container), which Docker's own port publishing below could not
      # reach; binding to all interfaces inside the container is safe
      # here because the host-side publish is loopback-only.
      - --server.http.listen-addr=0.0.0.0:12345
    # Alloy's own debugging/readiness HTTP interface — bound to
    # loopback only on the host, like every other observability port in
    # this stack.
    ports:
      - "127.0.0.1:12345:12345"
    # Has a shell but no curl/wget (confirmed via `docker run --entrypoint
    # sh ... -c "which curl wget"`), so no Docker-level HEALTHCHECK is
    # defined; readiness is instead verified functionally from the host
    # via its debug HTTP interface, the same pattern as loki/otel-collector.

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Phase 2B.4: alert rule files, evaluated by Prometheus itself
      # (see prometheus.yml's rule_files) and routed to alertmanager on
      # firing.
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    # Bound to loopback only — no authentication in front of Prometheus.
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Phase 3C: the Bearer token alertmanager.yml's webhook receiver
      # authenticates with (http_config.authorization.credentials_file).
      # Generated locally by scripts/init-webhook-secret.sh; gitignored
      # (the repo's blanket "secrets/" rule). Mounts the single FILE,
      # not its parent directory: this image runs as a real non-root
      # user ("nobody", uid 65534, confirmed via `docker inspect`), and
      # the host-side secrets/ directory is kept owner-only (0700, see
      # the init script) so no other host user can browse into it —
      # mounting the whole directory would make the container inherit
      # that same 0700-from-a-different-owner barrier and be unable to
      # even traverse into it. Mounting just the file sidesteps that:
      # the container's own (root-owned, normal-permission) directory
      # structure is used for traversal, and only the file's own mode
      # bits (0644 — see the init script) govern whether "nobody" can
      # read its content. The init script truncates-and-rewrites this
      # file in place (never replaces its inode), so a repaired/updated
      # token is visible to this bind mount without a container
      # restart.
      - ./observability/alertmanager/secrets/webhook-token:/etc/alertmanager/secrets/webhook-token:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    # Bound to loopback only — this is Alertmanager's real, unauthenticated
    # HTTP API (GET/POST /api/v2/*); never publish this beyond localhost.
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    volumes:
      # Mount only the datasources and dashboards subdirectories, not
      # the whole provisioning/ tree — the full tree would shadow
      # Grafana's other built-in provisioning directories (plugins/
      # alerting/notifiers) that we don't provide, causing startup
      # errors reading them.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Phase 2B.3: auto-provisions the dashboards under
      # observability/grafana/provisioning/dashboards/json/ — a
      # separate mount, added without touching the datasources mount
      # above or any other provisioning subdirectory.
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Bound to loopback only, in addition to Grafana's own admin auth.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local-development-only placeholders — see .env.example. Grafana
      # is only reachable on localhost in this environment.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_dev_only_change_me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Disable auto-update of bundled/preinstalled plugins (e.g.
      # Elasticsearch), so the pinned Grafana container doesn't attempt
      # runtime mutation of its own bundled plugin files on startup.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  alloy_data:
  alertmanager_data:
